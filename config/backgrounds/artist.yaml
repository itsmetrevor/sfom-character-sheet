id: artist
name: "Artist"
description: |
  You are either self taught or trained in an Art Form of your choice. Are you a painter, dancer, actor, or something more? Your abilities are capable of reaching into the souls of those who see your Art.
expertise:
  "charisma": 2
starting-items:
  - artists-tools
starting-items-text: "Artist's Tools: (Accessory) +1 Charisma when performing an 'Art Form'"
passives:
  plvl-0:
    name: "Art Form"
    summary: "Choose an Art form. Gain 'Inspired' when making a Charisma check to use it."
    detail: "Talk with the GM about what your Art Form is. Once its agreed upon, any time you use that Art Form you will gain 'Inspired'."
  plvl-3:
    name: "Performer"
    summary: "Gain Gold by making a Charisma Check when Performing in front of Crowds. 1-15 = 2 / 16-19 = 5 / 20+ = 10."
    detail: "The amount of gold you gain is based on how well you perform. The GM has some discretion on gold obtained based on crowd size or location."
  plvl-6:
    name: "Mesmerizing"
    summary: "Targets make a Resistance Check against your Charisma Check when you Perform. Failures are mesmerized."
    detail: "When you perform your Art Form there is a chance a Target will be inflicted with 'Mesmerized'. This means they can't look away as long as you are performing."
  plvl-9:
    name: "Perfection"
    summary: "Once per Full Rest, use your Art form on a Selected Target to cause a specific emotional reaction of your choice."
    detail: "When you peform your Art Form, you may choose a Target and they will have a specific emotional reaction of your choice. Will they weep tears of joy, remember who they once were, or realize the error of their ways?"
craftsman: false
source-pages: "p033"
