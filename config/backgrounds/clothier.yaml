# source: p031

id: clothier
name: "Clothier"
craftsman: true
description: |
  Four Craftsman backgrounds — Armorer, Blacksmith, Clothier, Jeweler — share crafting mechanics; each requires adventure resources, and resources impart effects on crafted Gear. See the Crafting Section, page XX. Capabilities: Light Armor & Clothing Accessories. Each comes with a specific 'Writ' shown to shop/forge proprietors for facility access.

expertise-modifiers:
  - crafting: 2

starting-items:
  - item: clothiers-writ
    quantity: 1
  - item: light-armor-generic
    quantity: 1

passives:
  - name: "Common"
    requirements: [ party-lvl: 0 ]
    summary: "Craft 1 Light Armor or Accessory. Required: 3 Materials. Armor/Acc. gains 1 Effect from Materials used."
    detail: "Craft 1 Light Armor or Accessory. Required: 3 Materials. Armor/Acc. gains 1 Effect from Materials used. (From ability-bar graphic; no paragraph details in source.)"
  - name: "Uncommon"
    requirements: [ party-lvl: 3 ]
    summary: "Craft 1 Light Armor or Accessory. Required: 7 Materials. Armor/Acc. gains 2 Effects from Materials used."
    detail: "Craft 1 Light Armor or Accessory. Required: 7 Materials. Armor/Acc. gains 2 Effects from Materials used. (From ability-bar graphic; no paragraph details in source.)"
  - name: "Rare"
    requirements: [ party-lvl: 6 ]
    summary: "Craft 1 Light Armor or Accessory. Required: 15 Materials. Armor/Acc. gains 3 Effects from Materials used."
    detail: "Craft 1 Light Armor or Accessory. Required: 15 Materials. Armor/Acc. gains 3 Effects from Materials used. (From ability-bar graphic; no paragraph details in source.)"
  - name: "Efficiency"
    requirements: [ party-lvl: 9 ]
    summary: "Reduce total Materials needed to Craft. Common: -1, Uncommon: -2, Rare: -3."
    detail: "Reduce total Materials needed to Craft. Common: -1, Uncommon: -2, Rare: -3. (From ability-bar graphic; no paragraph details in source.)"
