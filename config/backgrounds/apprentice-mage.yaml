# source: p032

id: apprentice-mage
name: "Apprentice Mage"
craftsman: false
description: |
  You are a novice Mage studying Elemental and Arcane magic to become a Wizard. As you progress you will learn various magic powers that will help you on your new journey.

expertise-modifiers:
  - knowledge: 1
  - intelligence: 1

starting-items:
  - item: basic-magic-tome
    quantity: 1

passives:
  - name: "Intellect"
    requirements: [ party-lvl: 0 ]
    summary: "Gain 'Inspired' when making an 'Intelligence' check about Arcane or Elemental Magic."
    detail: "You are Knowledgable of Arcane & Elemental Magic so related checks are easier for you to pass."
  - name: "Basic Magic"
    requirements: [ party-lvl: 3 ]
    summary: "You can cast basic Elemental Magic: Earth, Fire, Wind, Water, Ice, and Lightning."
    detail: "This magic is rudimentary, you can make a small flame, turn water into ice in a small area, etc. GM is allowed discretion on how much magic you may cast in specific circumstance."
  - name: "Detect Magic"
    requirements: [ party-lvl: 6 ]
    summary: "You can detect if an Item has magical properties and see what those properties are."
    detail: "If any item has magical properties you are capable of sensing exactly what those properties are. GM is allowed discretion on certain magical items you may have no knowledge of."
  - name: "Magic Hand"
    requirements: [ party-lvl: 9 ]
    summary: "Once per Full Rest, summon an invisible hand that acts as your own hand. It may move within 30ft of you."
    detail: "This is a floating hand that can move any direction within 30ft from you. It is capable of lifting objects that you would be capable of lifting yourself with one hand."
