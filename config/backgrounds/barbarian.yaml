# source: p034

id: barbarian
name: "Barbarian"
craftsman: false
description: |
  You were raised or taught by barbarians. You naturally have an intimidating presence, backed up by your raw strength. You do not easily tire and can push through the pain and exhaustion.

expertise-modifiers:
  - expertise: bravado
    value: 2

starting-items:
  - item: savage-axe
    quantity: 1

passives:
  - name: "Intimidating"
    requirements:
      - kind: party-level
        level: 0
    summary: "Gain +3 and reduce the required number for Critical Success -X when making a 'Bravado' Check."
    detail: "Your Intimidating presence give you a Bonus to all your Bravado checks."
  - name: "Endure"
    requirements:
      - kind: party-level
        level: 3
    summary: "Gain 1 'Exhaustion' to succeed at any Expertise Check using STR or CON, even after failing."
    detail: "You may push past your limits to succeed a check by gaining 1 'Exhaustion'. This may be done even after failing a check."
  - name: "Relentless"
    requirements:
      - kind: party-level
        level: 6
    summary: "Start Combat as if you have -3 'Exhaustion' (without losing Exhaustion)."
    detail: "Even when you are exhausted you don't let it effect you. When Combat starts you start as if you have 3 less 'Exhaustion' but you do not lose any Exhaustion from this effect."
  - name: "Forceful"
    requirements:
      - kind: party-level
        level: 9
    summary: "Use a 'Strength' Check in place of any Expertise using STR, DEX, LUK, or CON."
    detail: "Strength is your greatest asset and you may use brute force to succeed checks. You are capable of using your 'Strength' Expertise in place of any Expertise that uses the STR, DEX, LUK, or CON Stats."
