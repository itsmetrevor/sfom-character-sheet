id: guard
name: "Guard"
description: |
  You have been trained as a guard in some form. You have spent time as a bodyguard, royal guard, city guard or some other type of guard. You have patience and it's hard to catch you off-guard.
expertise:
  "concentration": 2
starting-items:
  - bronze-shield
starting-items-text: "Bronze Shield: (Off-Hand) +1 DEF"
passives:
  plvl-0:
    name: "Stalwart"
    summary: "Once per Full Rest, ignore the first Exhaustion gain."
    detail: "You are used to having to deal with long hours and harsh situations. Your body has been trained to not get exhausted that easily."
  plvl-3:
    name: "Focused"
    summary: "Once per Full Rest, your first 'Concentration' Check Succeeds."
    detail: "You have trained your mind to stay focused. You do not sway from your task so easily."
  plvl-6:
    name: "Guarded"
    summary: "Outside of Combat, you cannot be physically caught off guard."
    detail: "When someone tries to attack you, sneak up on you, or try to catch you off guard in any way, you are prepared. You will be able to react to the situation with an 'Expertise' Check of your choice."
  plvl-9:
    name: "Centered"
    summary: "Outside of Combat, you cannot be mentally or emotionally caught off guard."
    detail: "When someone tries to play with your mind, try to hurt your feelings, or even get you to react in a specific way, you are prepared. You will be able to react to the situation with an 'Expertise' Check of your choice."
craftsman: false
source-pages: "p037"
