id: psychologist
name: "Psychologist"
description: |
  You are a professional psychologist with knowledge of how to help people work through their problems.
expertise:
  "mind": 2
starting-items:
  - self-help-book
starting-items-text: "Self Help Book: (Accessory) +1 RES"
passives:
  plvl-0:
    name: "Find Truth"
    summary: "Make a 'Mind' check to find the deeper truth of what a Target says or feels."
    detail: "You are capable of reading between the lines of what someone is trying to say or how they are feeling. The difficulty of the 'Mind' Check is at the discretion of the GM."
  plvl-3:
    name: "Affirmation"
    summary: "Supportive language + passed 'Mind' Check opens the Target up."
    detail: "Here are a few examples of supportive language; I believe in you, take all the time you need, or you are not alone in this. The difficulty of the 'Mind' Check is at the discretion of the GM."
  plvl-6:
    name: "Talk it Out"
    summary: "Alone-with-Target 'Mind'/'Charisma' Checks gain 'Inspired'."
    detail: "To gain 'Inspired' on 'Mind' and 'Charisma' Checks you must be the only person speaking with the Target."
  plvl-9:
    name: "Enlightened"
    summary: "You cannot be deceived."
    detail: "You have always been good at catching when someone was withholding information. With your knowledge and experience you now notice any time someone is lying."
craftsman: false
source-pages: "p041"
