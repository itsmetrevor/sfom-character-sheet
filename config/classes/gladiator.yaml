id: gladiator
name: Gladiator
tier: starter
main-stat: CON
roles: []
combat-modifier:
  name: Shield Drum
  description: 'All attacks inflict Provoke. MAX HP equals double CON. +X damage per target Provoked from this character. Keep Taunt until another target is taunted.'
prerequisites: []
unlocks:
  - {class: beast-tamer, level: 10}
  - {class: knight, level: 10}
  - {class: monk, level: 10}
  - {class: priest, level: 10}
  - {class: thief, level: 10}
  - {class: wizard, level: 10}
  - {class: rune-knight, level: 15}
health-mod: 5
stats:
  main: {STR: 1, DEX: 0, CON: 2, MND: 0, INT: 0, LUK: 1}
  bonus: {JMP: 0, AGL: 0, DEF: 3, RES: 0, NRG: 0, FOR: 0}
x-start: 1
ultimate:
  name: Provoking Shout
  description: Inflict Provoke on all enemies; receive -CON damage from all attacks this round.
  charge:
    - Stagger/Expose an enemy
    - Provoke 2+ targets
    - Taunt a target
    - roll a Critical
expertise-tracks:
  - {expertise: Constitution, value: 1, unlock-at: 2}
  - {expertise: Throw/Catch, value: 1, unlock-at: 4}
