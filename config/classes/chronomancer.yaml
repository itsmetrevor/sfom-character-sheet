# source: p078
# note: Bonus 1 AGL/2 RES as printed. Both expertise tracks read Unlock 2 as printed. Sheet tracks 3 Time Warp Charges.

id: chronomancer
name: Chronomancer
roles: [ specialist ]
main-stat: mnd
tier: 2
x-start: 1

prerequisites:
  - class: priest
    level: 10

expertise-modifiers:
  - mind: 1
    requirements: [ class-lvl: 2 ]
  - knowledge: 1
    requirements: [ class-lvl: 2 ]

stat-modifiers:
  - max-hp: 0
  - mnd: 2
  - int: 1
  - luk: 1
  - agl: 1
  - res: 2

equipment:
  - main-hand: Focus
  - armor: Light Armor
  - off-hand: Tome

combat-modifier:
  - name: Change Fate
  - description: 'When another party member fails a check, spend 1 Time Warp to rewind — re-roll D20 adding LUK (Critical refunds Time Warp). Spending Time Warp gains 1 Energy. Time Warps refill each combat.'

ultimate:
  - name: Manipulate Time
  - description: Each party member gains Quick and Inspired; all enemies gain Slow and Dizzy; regain all Time Warp charges.
  - charge:
    - Boost an ability
    - inflict a Status Effect
    - Change Fate
    - use all Change Fate
    - roll a Critical

passives:
  - name: Retry
    target: all
    requirements: [ non-combat, well-rested ]
    description: 'Reverse time up to 1 minute; chosen targets in 5x5 on self remember what happened.'
  - name: Float
    target: self
    requirements: [ in-combat, target-approaches, constant ]
    description: Levitate (no terrain or fall damage).
  - name: Rewind
    target: T1 R10
    requirements: [ in-combat, class-adept, once-per-round, failed-check-nearby ]
    description: Re-roll a failed check.
  - name: Mindful
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent MND.

actions:
  - name: Heavy
    type: main
    tags: [ ranged, chrono ]
    cost: 'Energy 5, Boost: 5x5 within 5 instead'
    target-range: T1 R10
    check: 'D20+MND vs RES'
    description: 'Shave 15% current HP (round down); Expose 25%; Critical doubles.'
  - name: Pause
    type: main
    tags: [ chrono ]
    cost: 'Energy 5, Boost: inflict Pause (2) instead'
    target-range: T1 R10
    check: 'D20+MND vs RES'
    description: 'Expose Pause (no Move/actions till end of Enemy Step; no re-Pause).'
  - name: Repeat
    type: main
    tags: [ chrono ]
    cost: 'Energy 5, Boost: target gains Inspired till end of next turn'
    target-range: T1 R10
    check: 'Once per Combat'
    description: 'Target immediately takes another turn; main-class Chronomancers regain Time Warp.'
  - name: Falling Star
    type: main
    tags: [ ranged, chrono ]
    cost: Energy pool
    target-range: T1 1x1 within 5
    check: Critical
    description: 'Spend any Energy pre-roll — each point past first doubles size (2x2 steps) and adds +XD6; deals MND XD6 split evenly (round down) to all.'
  - name: Quick
    type: support
    tags: [ chrono ]
    cost: 'Energy 5, Boost: 3x3 within 10 instead'
    target-range: Self or 1 R10
    check: '—'
    description: 'Quick (+1 Main/Support/Movement next turn; expires end of that turn).'
  - name: Slow
    type: support
    tags: [ chrono ]
    cost: 'Energy 5, Boost: 3x3 within 10 instead'
    target-range: T1 R10
    check: 'D20+MND vs RES'
    description: Expose Slow (AGL halved, round down).
  - name: Levitate
    type: support
    tags: [ chrono ]
    cost: 'Energy 4, Boost: 5x5 within 5 instead'
    target-range: T1 R10
    check: 'D20+MND vs RES'
    description: Levitate till end of round.
  - name: Teleport
    type: support
    tags: [ chrono ]
    cost: 'Energy 5, Boost: up to (X+7) from start'
    target-range: Self or 1 non-Boss R10
    check: '—'
    description: Teleport up to (X+4) from start, ignoring verticality.
  - name: Time Loop
    type: reaction
    tags: [ ranged, chrono ]
    cost: '—'
    target-range: T1 R10
    check: 'Condition: end of target turn; Once per Combat'
    description: 'Pick 1 action target took (Main/Support/Move) — repeats exactly that every turn. Final card line partially obscured as-printed.'
  - name: Immobilize
    type: reaction
    tags: [ holy, magic ]
    cost: '—'
    target-range: T1 R10
    check: 'D20+MND vs RES; Condition: beginning/end of any target turn or before it moves; Successfully Once per Combat'
    description: 'Expose Immobilize (no Move till end of Enemy Phase; reusable if Resisted).'
