# source: p080
# note: Chart LVL 5 vs sheet header Beast Tamer LVL 10 — chart authoritative per notes, use LVL 5. Tall Tell as printed. Bonus 1 AGL/3 RES as printed.

id: negotiator
name: Negotiator
roles: [ specialist ]
main-stat: luk
tier: tier-2
x-start: 1
max-hp-mode: normal

prerequisites:
  - kind: class
    class: beast-tamer
    level: 5

expertise-modifiers:
  - expertise: charisma
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: deception
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: -5
  mnd: 1
  int: 1
  luk: 2
  agl: 1
  res: 3

equipment:
  main-hand: Ranged Piercing Pistol
  armor: Medium
  off-hand: Dagger

combat-modifier:
  name: Real Talk
  description: 'Describe talk freely; GM bonuses Expose checks by performance — Liked +2, Loved +4, Unbelievable +6. Lose any Mercy ally unless Main or Sub Class is Negotiator.'

ultimate:
  name: Silver Tongue
  description: Convince 1 non-boss target to leave battle; gain both Steal options from it.
  charge:
    - Chain an ability
    - inflict a Status Effect
    - Stagger an enemy
    - roll a Critical

passives:
  - name: Linguistics
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: Know all Ancestry Languages.
  - name: Steel Trap
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: 'Immune to mind-altering statuses (Berserk, Charm, Confuse, Fear, Mute, Provoke, Ruin, Sleep).'
  - name: Mediator
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: Talk range +3; add LUK to Expose checks.
  - name: Lucky
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent LUK.

actions:
  - name: Threatening Shot
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R10
    check: 'D20+INT vs DEF'
    description: 'RES -2 till end of turn; Stagger (X+2)D6; RES -LUK instead.'
  - name: Intimidate
    type: main
    tags: [ ranged, physical, talk ]
    cost: '—'
    target-range: T1 R5
    check: 'D20+LUK vs RES, Chain: use as Main Action'
    description: 'Expose Dizzy to understanding targets; Staggered with Threatening Shot lets 1 ally in R10 inflict Fear (Ally Target) till end of round.'
  - name: Condemn
    type: main
    tags: [ ranged, physical, talk ]
    cost: '—'
    target-range: T1 R5
    check: 'D20+LUK vs RES, Chain: use as Main Action'
    description: 'Expose Ruin (3); Staggered with Threatening Shot makes Ruin (2).'
  - name: Insult
    type: main
    tags: [ ranged, physical, talk ]
    cost: '—'
    target-range: T1 R5
    check: 'D20+LUK vs RES, Chain: use as Main Action'
    description: 'Expose Berserk; Staggered with Threatening Shot also inflicts Confused.'
  - name: Listen Here!
    type: support
    tags: [ ranged, physical, talk ]
    cost: 'Boost: 3x3 within 5'
    target-range: T1 R5
    check: 'D20+LUK vs RES'
    description: 'Expose Immobilized; Staggered with Threatening Shot upgrades to Pause (no re-Pause this combat).'
  - name: Tall Tell
    type: support
    tags: [ ranged, physical, talk ]
    cost: 'Boost: 3x3 within 5'
    target-range: T1 R5
    check: 'D20+LUK vs RES'
    description: 'Expose Sleep as printed (Tall Tell); not Staggered with Threatening Shot fail first Sleep check as rolled 1.'
  - name: Inspire
    type: support
    tags: [ ranged, physical, talk ]
    cost: 'Boost: target Ultimate Gauge +1'
    target-range: T1 R5
    check: '—'
    description: 'Inspired till end of their turn; roll 2D20 take highest.'
  - name: Persuade
    type: support
    tags: [ ranged, physical, talk ]
    cost: 'Boost: inflict Charmed (2)'
    target-range: T1 R5
    check: 'D20+LUK vs RES'
    description: 'Expose Charmed (GM roleplays; no re-Charm this combat).'
  - name: Mercy
    type: reaction
    tags: [ ranged, physical, talk ]
    cost: '—'
    target-range: T1 non-Boss R5
    check: 'D20+LUK vs RES; Condition: before KO understanding enemy; Successfully Once per Combat'
    description: 'Expose — joins as 1HP ally (may join party; stays to end of next combat then leaves/dies; enters adjacent as Ally Summon).'
  - name: Delay
    type: reaction
    tags: [ ranged, physical, talk ]
    cost: '—'
    target-range: T1 R5
    check: 'D20+LUK vs RES; Condition: any target begins turn; Successfully Once per Combat'
    description: Expose — it takes no turn this round.
