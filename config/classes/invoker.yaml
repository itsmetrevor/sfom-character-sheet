# source: p094
# note: All summons Energy 5 base as printed. Sheet has no separate Support block.

id: invoker
name: Invoker
roles: [ dps, healer, specialist ]
main-stat: mnd
tier: 3
x-start: 1

prerequisites:
  - class: scholar
    level: 15
  - class: chronomancer
    level: 10

expertise-modifiers:
  - mind: 1
    requirements: [ class-lvl: 2 ]
  - resistance: 1
    requirements: [ class-lvl: 4 ]

stat-modifiers:
  - max-hp: -5
  - dex: 1
  - mnd: 2
  - int: 1
  - def: 1
  - nrg: 1
  - for: 1

equipment:
  - main-hand: Focus Tome
  - armor: Light Armor
  - off-hand: Tome

combat-modifier:
  - name: Communion
  - description: 'Channeled Marker effects fire at start of next turn; vanish on firing unless stated. One channeled at a time unless stated; channeling ends if you use another Main. Grand Dragon (Ranged Summon Arcane; Square 7x7 within 10; D20+MND vs RES): MND to all enemies + Disabled; 7x7 marker dealing (X+3)D6+MND at next-turn start.'

ultimate:
  - name: Invoke the Heavens
  - description: Summon the Grand Dragon.
  - charge:
    - Expose a target
    - cast a Summon
    - land a marker hit
    - roll a Critical

passives:
  - name: Grant Me Audience
    target: self
    requirements: [ non-combat, well-rested ]
    description: Commune with Invoker summon for information/aid.
  - name: Celestial Blessing
    target: self
    requirements: [ in-combat, constant ]
    description: 'Once per round, -1 energy cost (min 1).'
  - name: Guidance
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: Summon damaging/healing abilities +1D6.
  - name: Mindful
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent MND.

actions:
  - name: Hellfire Demon
    type: main
    tags: [ ranged, summon, elemental, fire ]
    cost: Energy 5
    target-range: 2 targets Base R10 / channeled 5x5 within 10
    check: 'D20+MND vs RES'
    description: 'MND each + Burn DOT 3; marker fires (X+2)D6+MND with Severe (Burn).'
  - name: Earthen Giant
    type: main
    tags: [ ranged, summon, elemental, earth ]
    cost: Energy 5
    target-range: 5 squares Base R10 / channeled 5x5 within 10
    check: '—'
    description: 'Raise five 1x2 pillars (15HP, resummoned); marker fires (X+2)D6+MND + Immobilize.'
  - name: Crystal Fox
    type: main
    tags: [ ranged, summon, holy ]
    cost: Energy 5
    target-range: party Base Any / channeled 3x3 within 10
    check: '—'
    description: 'Party +2 DEF/+2 RES + Levitate till end of round; two markers each restore 1 energy, Regenerate DOT 5, MND+10 temp HP (max 20).'
  - name: Ice Queen
    type: main
    tags: [ ranged, summon, elemental, ice ]
    cost: Energy 5
    target-range: 2 targets Base R10 / channeled 5x5 within 10
    check: '—'
    description: 'MND each + Wet; marker fires (X+2)D6+MND + Frozen.'
  - name: Thunder Sage
    type: main
    tags: [ ranged, summon, elemental, lightning ]
    cost: Energy 5
    target-range: 2 targets Base R10 / channeled 3x3 within 10
    check: '—'
    description: 'Tether pair (half echoes); marker fires (X+2)D6+MND + Paralysis.'
  - name: Tidal Serpent
    type: main
    tags: [ ranged, summon, elemental, water ]
    cost: Energy 5
    target-range: full-field straight line
    check: '—'
    description: '3-wide serpent hits Wet targets for MND (Slowed inside); next-turn moves one dir dealing (X+2)D6+MND pushing 5 enemies along.'
  - name: Flame Phoenix
    type: main
    tags: [ ranged, summon, elemental, restorative, fire ]
    cost: Energy 5
    target-range: 2 targets Base R10 / channeled 5x5 within 10
    check: 'D20+MND vs RES'
    description: 'MND each + Fear (chosen); marker removes KO, restores (X+2)D6+MND, deals that to enemies.'
  - name: Dark Horseman
    type: main
    tags: [ ranged, summon, dark ]
    cost: Energy 5
    target-range: 1 target Base R10 / channeled 3x3 within 10
    check: 'D20+MND vs RES'
    description: 'Expose Sever (Support 1); marker fires (X+2)D6+MND, +3D6 center.'
  - name: Mecha Wall
    type: reaction
    tags: [ ranged, summon, holy ]
    cost: '—'
    target-range: Square R10
    check: 'Condition: beginning/end of target turn; Once per Combat'
    description: '1x5 indestructible wall till end of round — no crossing, adjacent allies cannot be Staggered/crit.'
  - name: Gale Harpy
    type: reaction
    tags: [ ranged, summon, wind ]
    cost: '—'
    target-range: Any targets all ranges
    check: 'Condition: beginning/end of any turn or before it moves'
    description: Shove any targets 5 squares one way, OR drag chosen 5 toward one square.
