# source: p068
# note: Sheet tracks 3 Holy Charges.

id: priest
name: Priest
roles: [ healer ]
main-stat: mnd
tier: 1
x-start: 1

prerequisites:
  - class: any-starter
    level: 10

expertise-modifiers:
  - mind: 1
    requirements: [ class-lvl: 2 ]
  - resistance: 1
    requirements: [ class-lvl: 4 ]

stat-modifiers:
  - max-hp: 0
  - mnd: 2
  - int: 1
  - luk: 1
  - res: 4

equipment:
  - main-hand: Focus Tome
  - armor: Light Armor
  - off-hand: Tome

combat-modifier:
  - name: Holy Charge
  - description: 'Each Restorative magic ability gains a Holy Charge; at 3, immediately cast 1 Magic ability for 0 Energy. Uses Auto-Regenerate even un-unlocked. Magic Ranged Healer.'

ultimate:
  - name: Grand Blessing
  - description: Revive and fully heal each party member.
  - charge:
    - restore 10+ HP to a target
    - cast magic for 0 Energy
    - restore another target to full
    - roll a Critical

passives:
  - name: Sacred Senses
    target: all
    requirements: [ non-combat ]
    description: Inspired on Resistance.
  - name: Holy Insight
    target: T1 R10
    requirements: [ in-combat, once-per-round, reaction ]
    description: 'Stagger reveals 1 chosen info (D20+MND vs 13): HP, resistances, weaknesses.'
  - name: Auto-Regenerate
    target: self
    requirements: [ in-combat, class-adept, damaged, constant ]
    description: Gain Regenerate DOT restoring MND at Status Step, lost at combat end.
  - name: Mindful
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent MND.

actions:
  - name: Heala
    type: main
    tags: [ ranged, restorative, holy ]
    cost: 'Energy 4, Boost: +MND restored'
    target-range: Self or 1 R10
    check: Critical
    description: (X+1)D6 + MND.
  - name: Revive
    type: main
    tags: [ ranged, restorative, holy ]
    cost: 'Energy 5, Boost: +MND'
    target-range: T1 R10
    check: Critical
    description: 'Remove Knocked Out; XD6 + MND; Unseen + Damage Immunity till end of round.'
  - name: Healios
    type: main
    tags: [ restorative, holy ]
    cost: 'Energy 5, Boost: +1D6 each in range'
    target-range: T1 5x5 within 10
    check: Critical
    description: XD6 + MND to all allies.
  - name: Radiance
    type: main
    tags: [ ranged, chrono, magic ]
    cost: 'Energy 6, Boost: +1D6 restored'
    target-range: 5x5 on self
    check: 'D20+MND vs RES'
    description: 'MNDxD6 damage; Expose Stun to all (Stunned immune to re-Stun this combat).'
  - name: Heal
    type: support
    tags: [ restorative ]
    cost: 'Energy 4, Boost: +1D6'
    target-range: T1 R10
    check: Critical
    description: XD6 + MND.
  - name: Mend
    type: support
    tags: [ restorative ]
    cost: 'Energy 3, Boost: 2nd target'
    target-range: T1 R10
    check: 'D20+MND vs RES'
    description: Remove 1 Status Effect (not Knocked Out).
  - name: Holy Armor
    type: support
    tags: [ holy ]
    cost: 'Energy 4, Boost: target -5 damage till end of round'
    target-range: Self or 1 R10
    check: '—'
    description: Target DEF and RES equal your MND till end of round.
  - name: Regenerate
    type: support
    tags: [ holy ]
    cost: 'Energy 5, Boost: HP equal to MND+3'
    target-range: Self or 1 R10
    check: '—'
    description: Gain Regenerate DOT (MND at Status Step, lost at combat end).
  - name: Prepared Spell
    type: reaction
    tags: [ magic ]
    cost: '—'
    target-range: Self
    check: 'Condition: any target ends its turn; Once per Combat'
    description: Immediately use a Magic ability.
  - name: Holy Blessing
    type: reaction
    tags: [ ranged, holy ]
    cost: '—'
    target-range: Self or 1 R10
    check: 'Condition: any target ends its turn; Once per Combat'
    description: Restore X+1 Energy.
