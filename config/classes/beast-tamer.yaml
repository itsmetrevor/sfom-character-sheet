# source: p062

id: beast-tamer
name: Beast Tamer
roles: [ dps, specialist ]
main-stat: dex
tier: 1
x-start: 1

prerequisites:
  - class: any-starter
    level: 10

expertise-modifiers:
  - charisma: 1
    requirements: [ class-lvl: 2 ]
  - nature: 1
    requirements: [ class-lvl: 4 ]

stat-modifiers:
  - max-hp: 0
  - dex: 2
  - mnd: 1
  - luk: 1
  - def: 2
  - res: 2

equipment:
  - main-hand: Piercing 2H Bow (uses Off-Hand slot)
  - armor: Medium Armor
  - off-hand: none (2-hander uses both slots)

combat-modifier:
  - name: Trained Beasts
  - description: 'Choose Falcon, Large Snake, or Wolf; one Summoned at a time unless stated. Move beasts on your turn; act per Command used. +1 stat (max 3) per 2 Party Levels; +2 Max HP per Party Level. Re-summon swaps (recalled heal to Attack stat). KO beasts stay unsummoned. Beasts count as Summons and Party Members. Rules persist as subclass. Physical Ranged Summoner.'

ultimate:
  - name: Heed My Call
  - description: Use Summon Beast to summon ALL beasts; Commands affect all.
  - charge:
    - beast Staggers/Exposes
    - summon a beast
    - use a Command
    - roll a Critical

passives:
  - name: Beast Communion
    target: self
    requirements: [ non-combat, constant ]
    description: Communicate with animals and beasts.
  - name: Medium Armor Proficiency
    target: self
    requirements: [ in-combat, constant ]
    description: 'Equip Medium anywhere; DEF and FOR +1.'
  - name: Training
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: Summons +1 AGL and +1 crit chance.
  - name: Dexterous
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent DEX.

actions:
  - name: Targeted Shot
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R10
    check: 'D20+DEX vs DEF, Chain: Reaction-use Attack support'
    description: 'Beasts deal +XD6 this turn; Stagger (X+1)D6 + DEX.'
  - name: Summon Beast
    type: main
    tags: [ ranged, summon, physical ]
    cost: '—'
    target-range: Square R5
    check: 'Chain: summoned beasts deal 1D6'
    description: 'Summon 1 beast to empty square; beasts adjacent to enemies deal 1D6 + Beast Main Stat.'
  - name: Running Drills
    type: main
    tags: [ ranged, summon, physical ]
    cost: '—'
    target-range: Summon R7
    check: 'Chain: Reaction-use Distract if available'
    description: +2 AGL, +1 JMP.
  - name: Encourage
    type: main
    tags: [ ranged, physical, talk ]
    cost: '—'
    target-range: Summon R7
    check: 'Boost: Reaction-use Whistle if available'
    description: Gain Inspired.
  - name: Attack!
    type: support
    tags: [ command ]
    cost: '—'
    target-range: Summon R7
    check: '—'
    description: 'Use Attack on Beast Tamer card, or deal XD6 to 1 target within Range 1.'
  - name: Distract!
    type: support
    tags: [ command ]
    cost: '—'
    target-range: Summon R7
    check: '—'
    description: Use Distract, or inflict Weak (2) within Range 1.
  - name: Whistle!
    type: support
    tags: [ command ]
    cost: '—'
    target-range: Summon R7
    check: '—'
    description: Use Whistle, or Provoke within Range 5.
  - name: Go All Out!
    type: support
    tags: [ command ]
    cost: Twice per Combat
    target-range: Summon R7
    check: '—'
    description: Use Go All Out, or deal (2+X)D6 within Range 1.
  - name: Tame Beast
    type: reaction
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 non-Boss Beast R3
    check: 'D20+MND vs RES; Successfully Once per Combat'
    description: 'Expose Tamed (max 3; 4th replaces one releasing it; Resisted beasts immune this combat). Sheet tracks 3 names.'
  - name: Recall
    type: reaction
    tags: [ ranged, physical ]
    cost: '—'
    target-range: 1 Summon Beast R10
    check: 'Condition: before target is attacked; Once per Combat'
    description: Remove it from battlefield.
