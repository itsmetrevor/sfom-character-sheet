# source: p066
# note: Sheet tracks Combo Points.

id: monk
name: Monk
roles: [ dps, healer ]
main-stat: str
tier: tier-1
x-start: 1
max-hp-mode: normal

prerequisites:
  - kind: any-starter
    level: 10

expertise-modifiers:
  - expertise: strength
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: nature
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: 0
  str: 2
  dex: 1
  mnd: 1
  agl: 1
  def: 1
  res: 1

equipment:
  main-hand: Unarmed (gloves/wraps, none)
  armor: Light Armor
  off-hand: Unarmed

combat-modifier:
  name: Disciple of the Fist
  description: 'Way of the Fist checks can Crit for double damage. Each Stagger/Expose gains 1 Combo Point (max 6); spend points before Way-of-the-Fist check for Inspired per point on 1 check (no points on spent-point checks). Without ranged weapon, Sub-Class physical ranged count as Ranged Elemental Wind Magic. Physical Melee Damage Dealer.'

ultimate:
  name: Full Palm Barrage
  description: Gain Inspired; use Way of the Fist; +3 on all checks for the attack.
  charge:
    - Push/Pull a target
    - x2 Way-of-the-Fist hits
    - x4 hits
    - roll a Critical

passives:
  - name: Balanced
    target: self
    requirements:
      - kind: non-combat
      - kind: well-rested
    description: May succeed a Concentration or Mind check.
  - name: Unarmed Proficiency
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: 'Equip Unarmed anywhere; melee Physical Attack abilities +X damage and +X Stagger/Expose with no Off-Hand.'
  - name: Counter Attack
    target: T1 R1
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: attacked-in-range
    description: 'Counter with STR check (D20+STR vs DEF); Stagger STR+X.'
  - name: Stronger
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent STR.

actions:
  - name: Vital Punch
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF, Chain: STR damage + Paralysis'
    description: 'STR damage and Paralysis; Stagger +XD6, or inflict Ruin (3) instead.'
  - name: Way of the Fist
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF'
    description: 'STR damage; Stagger climbs 1 on Combo Track and repeats until failure or track end, dealing each passed square bonus; unusable with Unarmed Main-Hand.'
  - name: Vortex
    type: main
    tags: [ ranged, elemental, wind, magic ]
    cost: 'Energy 6, Boost: use your Expose check'
    target-range: 5x5 centered on self
    check: 'D20+MND vs RES'
    description: 'MND damage to all; Expose pulls up-to-2-square targets adjacent.'
  - name: Spin Kick
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: 3x3 centered on self
    check: 'D20+STR vs DEF, Chain: X damage push all within Range 3'
    description: 'STR to all; Stagger +XD6.'
  - name: Kick
    type: support
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF'
    description: 'STR damage; Stagger pushes 1-square target (X+1) spaces straight.'
  - name: Purify
    type: support
    tags: [ restorative, magic ]
    cost: Once per Combat
    target-range: Self
    check: '—'
    description: Remove all Status Effects from self.
  - name: Earth Shatter
    type: support
    tags: [ ranged, elemental, earth, magic ]
    cost: 'Energy 4, Boost: 3x4 line instead'
    target-range: 1x4 line
    check: 'D20+MND vs DEF'
    description: 'MND damage in line; Stagger +MND+STR and Slow.'
  - name: Aura
    type: support
    tags: [ melee, restorative, magic ]
    cost: 'Energy 5, Boost: restore MND x STR instead'
    target-range: Self 3x3
    check: Critical
    description: Restore MND to all in range plus 1 Energy to others.
  - name: Preemptive Strike
    type: reaction
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'Condition: before adjacent target attacks; Once per Combat'
    description: 'Interrupt attack entirely; deal XD6 + STR.'
  - name: Bind Soul
    type: reaction
    tags: [ melee, restorative, magic ]
    cost: '—'
    target-range: T1 R1
    check: 'Critical; Condition: your turn or end of any target turn; Once per Combat'
    description: 'Remove Knocked Out, restore XD6 + MND, grant Unseen + Damage Immunity till end of round.'
