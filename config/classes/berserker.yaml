# source: p076
# note: Main stats 2 STR/2 CON as printed. Sheet tracks Rage and Chain Counter; use Chain Counter for mains.

id: berserker
name: Berserker
roles: [ dps, tank ]
main-stat: str
tier: 2
x-start: 1

prerequisites:
  - class: monk
    level: 10

expertise-modifiers:
  - strength: 1
    requirements: [ class-lvl: 2 ]
  - bravado: 1
    requirements: [ class-lvl: 4 ]

stat-modifiers:
  - max-hp: 5
  - str: 2
  - con: 2
  - agl: 1
  - def: 1

equipment:
  - main-hand: Slashing or Unarmed (none)
  - armor: Medium Armor
  - off-hand: Pistol or Crossbow

combat-modifier:
  - name: Pure Rage
  - description: 'All attacks Provoke. MAX HP equals double CON. Each damage instance +1 Rage (max 5); each Rage -1 damage received. Extend Chains spending 1 Rage per extra Chain (energy still applies). Immune to Berserk.'

ultimate:
  - name: Wrath & Rampage
  - description: Gain full Rage; chaining into Beatdown will Critical.
  - charge:
    - Provoke 2+ targets
    - gain 2+ Rage
    - Chain 2+ times
    - roll a Critical

passives:
  - name: Brute Force
    target: self
    requirements: [ non-combat ]
    description: STR for any expertise check.
  - name: Aggression
    target: self
    requirements: [ in-combat, constant ]
    description: Each round first Chained ability costs 0 Energy.
  - name: Unhinged
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: Chain twice per turn.
  - name: Stronger
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent STR.

actions:
  - name: Beatdown
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF, Chain: STR damage +X per other Chain this round besides Beatdown'
    description: 'STR damage; chaining Roar next inflicts Disable instead.'
  - name: Roar
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: 5x5 centered on self
    check: 'D20+STR vs RES, Chain: use as Main Action'
    description: 'Provoke all; chaining Ferocious Vault next extends to Range 10; Expose Paralysis.'
  - name: Ferocious Vault
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R5
    check: 'D20+STR vs DEF, Chain: use as Main Action no Stagger'
    description: 'Leap adjacent, STR damage; chaining Brutalize next adds +XD6; Stagger +XD6.'
  - name: Brutalize
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF, Chain: use as Main Action no Stagger'
    description: 'STR damage; chaining Beatdown next costs 0 Energy; Stagger XD6.'
  - name: Dash Strike
    type: support
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R3
    check: 'D20+STR vs DEF'
    description: 'Move adjacent between you and target; X damage; counts as Chained for Beatdown; Stagger +STR.'
  - name: Pump Up
    type: support
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: Critical
    description: 'Attacks +X this turn; receive -X per attack till end of round; Critical doubles.'
  - name: Raging
    type: support
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: Critical
    description: 'Crit-required -X this round; may roll Crits on Chained abilities; Critical doubles.'
  - name: Adrenaline
    type: support
    tags: [ melee, physical ]
    cost: Once per Combat
    target-range: Self
    check: Critical
    description: 'Receive -CON damage; +1 Energy whenever damaged till end of round; Critical doubles.'
  - name: Howl
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Condition: your turn or before being attacked; Once per Combat'
    description: Gain (Xx10) temporary HP.
  - name: Unstoppable
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Condition: before being attacked; Once per Combat'
    description: '+5 RES and DEF; each damage instance this round moves you X squares (can Push up to 2-square targets).'
