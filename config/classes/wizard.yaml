# source: p072
# note: Health -5 as printed. Sheet tracks 3 Elemental Charges.

id: wizard
name: Wizard
roles: [ dps ]
main-stat: int
tier: tier-1
x-start: 1
max-hp-mode: normal

prerequisites:
  - kind: any-starter
    level: 10

expertise-modifiers:
  - expertise: intelligence
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: knowledge
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: -5
  con: 1
  mnd: 1
  int: 2
  def: 1
  res: 3
  for: 1

equipment:
  main-hand: Focus Tome
  armor: Light Armor
  off-hand: Tome

combat-modifier:
  name: Elemental Power
  description: 'Elemental magic grants Elemental Charge (max 3). Spend ALL charges before Elemental attack to enhance by count — 1: Boost for 0 Energy; 2: target Square 5x5 within 10 instead; 3: +XD6 damage. Magic Ranged Damage Dealer.'

ultimate:
  name: Arcane Blast
  description: 4D6 in 5x5 area within 10 squares.
  charge:
    - use 2 Main Actions
    - spend Charges
    - Boost an ability
    - roll a Critical

passives:
  - name: Basic Magic
    target: self
    requirements:
      - kind: non-combat
      - kind: constant
    description: Simple Fire/Ice/Lightning cantrips (flame, freeze water, current).
  - name: Focus Weapon Proficiency
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: 'Equip Focus anywhere; once per round with Boost, 1 or 6 uses Boost for 0 Energy.'
  - name: Glass Cannon
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: '-1 CON/MND/DEF/RES, +1 INT/NRG as printed.'
  - name: Intellectual
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent INT.

actions:
  - name: Fire
    type: main
    tags: [ ranged, elemental, fire ]
    cost: 'Energy 4, Boost: Stagger inflicts Burn DOT 3'
    target-range: T1 R10
    check: 'D20+INT vs DEF'
    description: '1D6 + INT; Stagger +XD6.'
  - name: Ice
    type: main
    tags: [ elemental, ice ]
    cost: 'Energy 4, Boost: +XD6'
    target-range: T1 R10
    check: 'D20+INT vs RES'
    description: '1D6 + INT; Expose Slow.'
  - name: Lightning
    type: main
    tags: [ ranged, elemental, lightning ]
    cost: 'Energy 4, Boost: +XD6'
    target-range: T1 R10
    check: 'D20+INT vs RES'
    description: 'INT damage; Expose Lightning DOT 5.'
  - name: Arcane Orb
    type: main
    tags: [ ranged, arcane ]
    cost: 'Energy 7, only if no other Main/Secondary used; lose all Charges at end of turn'
    target-range: 5x5 within 10
    check: 'D20+INT vs DEF'
    description: 'INT + 3D6 to all; Stagger +(1+X)D6.'
  - name: Quick Cast
    type: support
    tags: [ arcane, magic ]
    cost: '—'
    target-range: Self
    check: '—'
    description: Use a Main-Action Magic ability still available this combat.
  - name: Sleep
    type: support
    tags: [ ranged, arcane ]
    cost: 'Energy 4, Boost: 5x5 within 10 instead'
    target-range: T1 R10
    check: 'D20+INT vs RES'
    description: 'Expose Sleep (Sleep-inflicted immune to re-Sleep this combat).'
  - name: Energize
    type: support
    tags: [ arcane, magic ]
    cost: Once per Combat
    target-range: Self
    check: '—'
    description: Restore 2 Energy; next Magic costs 1 less (min 1).
  - name: Elemental Master
    type: support
    tags: [ elemental ]
    cost: Once per Combat
    target-range: Self
    check: '—'
    description: 'Next Elemental attack guaranteed to Stagger, gains every Elemental Boost, cannot be Resisted.'
  - name: Counter Spell
    type: reaction
    tags: [ magic ]
    cost: '—'
    target-range: T1 R10
    check: 'Condition: any target in range uses Magic; Once per Combat'
    description: Interrupt it, negating everything.
  - name: From the Aether
    type: reaction
    tags: [ ranged, holy ]
    cost: '—'
    target-range: Self or 1 R10
    check: 'Condition: your turn or any target ends turn; Once per Combat'
    description: Restore X+1 Energy to target.
