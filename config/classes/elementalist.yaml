# source: p100
# note: Main stats 2 STR/2 MND/1 INT and bonus 1 RES as printed. Equipment header mislabeled Expertise Specialties in source. Charges refill 1 at turn start.

id: elementalist
name: Elementalist
roles: [ dps, healer ]
main-stat: int
tier: tier-4
x-start: 1
max-hp-mode: normal

prerequisites:
  - kind: class
    class: monk
    level: 5
  - kind: class
    class: samurai
    level: 10
  - kind: class
    class: alchemist
    level: 10

expertise-modifiers:
  - expertise: intelligence
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: throw-catch
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: 0
  str: 2
  mnd: 2
  int: 1
  res: 1

equipment:
  main-hand: Focus or Unarmed (none)
  armor: Medium Armor
  off-hand: Tome

combat-modifier:
  name: Elemental Power
  description: 'Combat start gains 1 Elemental Charge of choice; each turn pick Active element coloring all attacks. Boost (Elemental Charge): spend specific Charge instead of Energy. Fire Burn DOT X (stacks +X on burning); Ice Slow (slowed/wet freeze); Lightning arcs within 5; Wind push/pull 5; Water heals allies + Wet; Earth 5x5 centered on target. Magic Ranged All-Rounder.'

ultimate:
  name: Elemental Master
  description: Activate 3 elements; gain 1 charge of all 6; use 1 active ability.
  charge:
    - spend an Elemental Charge
    - spend 2+ Energy
    - resist an effect
    - roll a Critical

passives:
  - name: Elemental Control
    target: self
    requirements:
      - kind: non-combat
    description: Steer element within 5 squares for 1 minute.
  - name: Brave the Elements
    target: Square 3x3 within 5
    requirements:
      - kind: in-combat
      - kind: once-per-round
      - kind: reaction
    description: Clear all terrain effects from markers in range (even obstacle-makers).
  - name: Master of Elements
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: 'When dealt Elemental damage, take it for +2 Energy or absorb as HP.'
  - name: Intellectual
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent INT.

actions:
  - name: Burst
    type: main
    tags: [ melee, elemental ]
    cost: 'Energy 5, Boost (+): +XD6'
    target-range: T1 R1
    check: 'D20+INT vs DEF'
    description: '1D6 + INT; Stagger +XD6.'
  - name: Blast
    type: main
    tags: [ ranged, elemental ]
    cost: 'Energy 5, Boost (+): one extra target'
    target-range: T1 R7
    check: 'D20+INT vs DEF'
    description: 'INT to target; Stagger +XD6.'
  - name: Elemental Pool
    type: main
    tags: [ ranged, elemental ]
    cost: 'Energy 5, Boost (+): 5x5 marker sparing allies'
    target-range: Square 3x3 within 5
    check: '—'
    description: '3x3 Pool dealing charged element — INT to entrants/turn-starters.'
  - name: Nature's Fury
    type: main
    tags: [ ranged, elemental ]
    cost: Energy pool
    target-range: Square 1x1 within 7
    check: 'D20+INT vs DEF'
    description: '1D6+INT to all; spend all Charges for +1D6 each and +2x2 size per charge.'
  - name: Absorption
    type: support
    tags: [ ranged, elemental ]
    cost: 'Energy 5, Boost (+): 3x3 within 10'
    target-range: Self or 1 R5
    check: '—'
    description: 'Absorb (Element) till end of round, healing from charged-element damage taken.'
  - name: Infliction
    type: support
    tags: [ melee, elemental ]
    cost: 'Energy 5, Boost (+): auto-succeed Expose'
    target-range: T1 R1
    check: 'D20+INT vs RES'
    description: 'Inflict by element — Fire Berserk, Ice Disable, Earth Immobilize, Wind Levitate, Water Inspire, Lightning Quick.'
  - name: Elemental Aspect
    type: support
    tags: [ ranged, summon, elemental ]
    cost: 'Energy pool, Once per Combat'
    target-range: Square R5
    check: '—'
    description: 'Summon Aspect acting on your turn — Main INT to all in 5x5 with every Active effect (20HP 10 DEF/RES 14 AGL 3 JMP status-immune).'
  - name: Duality
    type: support
    tags: [ elemental ]
    cost: 'Boost (+): 2 Energy to reuse; Once per Combat'
    target-range: Self
    check: '—'
    description: Activate extra Element charge this round.
  - name: Elemental Control
    type: reaction
    tags: [ elemental ]
    cost: '—'
    target-range: Self or 1 R7
    check: 'Condition: any time before/after any action'
    description: 'Spend 1 Charge to pull/push 5 one way, +2 Jump a round, or Levitate a round.'
  - name: From the Aether
    type: reaction
    tags: [ elemental ]
    cost: '—'
    target-range: Self
    check: 'Condition: your turn or any target ends turn'
    description: Convert any number of Charges into Energy.
