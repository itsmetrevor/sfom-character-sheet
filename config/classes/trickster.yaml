# source: p060

id: trickster
name: Trickster
roles: [ specialist ]
main-stat: luk
tier: starter
x-start: 1
max-hp-mode: normal

prerequisites: []

expertise-modifiers:
  - expertise: luck
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: deception
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: -5
  dex: 1
  int: 1
  luk: 2
  jmp: 1
  agl: 1
  for: 1

equipment:
  main-hand: Bludgeoning Hammer
  armor: Light Armor
  off-hand: Pistol or 1H Crossbow (no bonus)

combat-modifier:
  name: Up My Sleeve
  description: 'Trickster Main Ability rolls use D6 for bonus effects. Rolling 1 banks a Wild Card. Wild Cards may be spent to choose effects instead of rolling (like Fortune Die). Wild Cards expire at combat end. Immune to own markers. Physical/Magic Melee Saboteur.'

ultimate:
  name: Wild Side
  description: Gain Max Wild Cards; all party members' D6 rolls cannot be lower than LUK this round.
  charge:
    - place a marker
    - gain/spend a Wild Card
    - inflict a Status Effect
    - roll a Critical

passives:
  - name: Tricksy
    target: self
    requirements:
      - kind: non-combat
      - kind: constant
    description: 'Inspired on Deception. Source prints trailing ZZZZ as-printed.'
  - name: Bludgeoning Weapon Proficiency
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: 'Equip Bludgeoning with any class; melee Stagger abilities Push target 2 squares.'
  - name: Lucky Roll
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: FOR +2.
  - name: Lucky
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent LUK.

actions:
  - name: Party Popper
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+DEX+LUK vs DEF, Chain: roll D6'
    description: 'XD6 damage. 1 wild card; 2 +LUK damage; 3 Confuse; 4 Berserk; 5 Mute; 6 Dizzy.'
  - name: Surprise Gift
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: Square 3x3 within 5
    check: 'roll D6, Chain: marker on adjacent square triggers on entry'
    description: 'XD6 to all. 1 wild card; 2 Frozen; 3 Burn; 4 Bleed; 5 Sleep; 6 Burn DOT 3.'
  - name: Trip Wire
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: Empty squares 3x1 within 5
    check: roll D6
    description: 'Gain Wild Card. 3x1 marker; movers take XD6 + rolled effect then Knocked Prone, marker removed. 1 wild; 2 Immobilize; 3 Confuse; 4 Berserk; 5 Paralyze; 6 Stun.'
  - name: Pick a Card
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R5
    check: 'roll D6, Chain: roll D6'
    description: 'XD6 damage; spend Wild Cards, +LUK damage each. 1 wild; 2 Mute; 3 Bleed DOT 2; 4 Weak; 5 Daze; 6 Disable.'
  - name: Oil Slick
    type: support
    tags: [ ranged, physical ]
    cost: '—'
    target-range: Square 3x3 within 5
    check: 'D20+LUK vs RES'
    description: '3x3 Difficult Terrain marker; movers Resist or gain Prone. Expose: hit with Fire becomes Fire marker — 2D6 to all + 1D6 per square travelled.'
  - name: Merry-Go-Round
    type: support
    tags: [ ranged, magic ]
    cost: '—'
    target-range: Square 3x3 within 3
    check: 'roll D6; Condition: beginning of target turn or entering range'
    description: '3x3 marker; movers spin it, gain effect, must finish movement to reuse. 1 nothing; 2 cw1; 3 cw2; 4 cw3; 5 marker cw4; 6 +3 + Dizzy.'
  - name: Inflatable Decoy
    type: support
    tags: [ ranged, physical ]
    cost: Once per Combat
    target-range: Square R5
    check: '—'
    description: '15HP decoy marker; enemies within 5 attack Decoy (not LUK damage); destroyed deals (X+2)D6 to all in 5x5.'
  - name: Throw Pie
    type: support
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R5
    check: 'D20+LUK vs RES'
    description: 'Ally restores XD6-LUK HP; Expose Blind; target -5 vs Oil Slick while Blind.'
  - name: Magic Mirror
    type: reaction
    tags: [ ranged, magic ]
    cost: '—'
    target-range: Self or 1 R5
    check: 'Condition: before target makes attack; Once per Combat'
    description: Attackers gain Dizzy vs selected target till end of round.
  - name: Play Dead
    type: reaction
    tags: [ ranged, magic ]
    cost: '—'
    target-range: Self or 1 R5
    check: 'Condition: start or end of any target turn; Once per Combat'
    description: Target goes Prone; prone-staying targets cannot be targeted this round.
