# source: p074
# note: Health -5 as printed. Main stats 4 boxes as printed (1 DEX/2 CON/1 MND/1 INT). Bonus 1 JMP/1 NRG as printed. Sheet tracks Light and Dark charges.

id: battle-mage
name: Battle Mage
roles: [ dps, healer ]
main-stat: int
tier: tier-2
x-start: 1
max-hp-mode: normal

prerequisites:
  - kind: class
    class: wizard
    level: 10

expertise-modifiers:
  - expertise: dexterity
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: bravado
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: -5
  dex: 1
  con: 2
  mnd: 1
  int: 1
  jmp: 1
  nrg: 1

equipment:
  main-hand: Slashing or Focus Sword
  armor: Heavy Armor
  off-hand: Shield

combat-modifier:
  name: Balance
  description: 'May use Double Cast un-unlocked. Restorative Magic gains Dark Charge; Magic Attack gains Light Charge. Boost for 0 Energy while Light and Dark counts match. At 3 each, spend all to cast 1 Magic for 0 Energy (no charges that way).'

ultimate:
  name: True Balance
  description: 3D6 damage to enemies and 3D6 HP to party in 5x5 line across field.
  charge:
    - use a Boost for 0 Energy
    - gain a Light Charge
    - gain a Dark Charge
    - roll a Critical

passives:
  - name: Mind, Body, and Soul
    target: self
    requirements:
      - kind: non-combat
      - kind: constant
    description: Swap STR/DEX checks to MND/INT or vice versa.
  - name: Parry Sword
    target: self
    requirements:
      - kind: in-combat
      - kind: attacked-while-armed
    description: 'Roll D20, beat attack total to take no damage; once per round.'
  - name: Double Cast
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: 'Once per round with Magic ability, cast any 2 Magic abilities as 1 instead (may repeat one); pay energy as followed.'
  - name: Intellectual
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent INT.

actions:
  - name: Defiance
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+DEX vs DEF, Chain: X damage Jump up to 5 carrying 1-square target; Boost jump 7 ignore verticality'
    description: 'DEX damage; Jump up to 5 from target; Stagger +XD6.'
  - name: Arcane Missile
    type: main
    tags: [ ranged, arcane ]
    cost: 'Energy 5, Boost: 5x5 within 10 instead'
    target-range: T1 R7
    check: 'D20+INT vs DEF'
    description: 'Gain 1 Light; spend up to 1 Dark for +XD6; INT damage; Stagger +XD6.'
  - name: Holy Touch
    type: main
    tags: [ melee, restorative, holy ]
    cost: 'Energy 4, Boost: 5x5 on target instead'
    target-range: Self or 1 R1
    check: Critical
    description: 'Gain 1 Dark; spend up to 1 Light for +XD6 restored; restores (X+2)D6 + MND.'
  - name: Ultra Beam
    type: main
    tags: [ ranged, arcane, holy, restorative ]
    cost: 'Energy 6, Boost: 5x5 straight line across whole field'
    target-range: 3x3 straight line
    check: 'D20+INT vs DEF'
    description: 'Spend ALL charges (+1D6 dealt/+1D6 restored per charge); 1D6+INT to enemies, 1D6+MND to allies.'
  - name: Restore
    type: support
    tags: [ ranged, restorative, holy ]
    cost: 'Energy 4, Boost: also remove 1 Status incl KO'
    target-range: Self or 1 R7
    check: Critical
    description: 'Gain 1 Dark; spend 1 Light for +MND restored; restores XD6 + MND.'
  - name: Vex Blade
    type: support
    tags: [ melee, arcane ]
    cost: 'Energy 4, Boost: +XD6'
    target-range: T1 R1
    check: 'D20+INT vs RES'
    description: 'Gain 1 Light; spend 1 Dark to inflict Weak (3); INT damage; Expose Daze.'
  - name: Force
    type: support
    tags: [ arcane ]
    cost: 'Energy 4, Boost: range/push +INT'
    target-range: Target 1 Range DEX
    check: '—'
    description: 'Spend 1 Light/Dark for range/push +MND; Push 1-square target DEX squares away, or Pull square target DEX squares close.'
  - name: Charge Up
    type: support
    tags: [ magic ]
    cost: 'Boost: gain 1 Light AND 1 Dark'
    target-range: Self
    check: '—'
    description: Gain 1 Light or 1 Dark Charge.
  - name: Evasive Maneuvers
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Condition: your turn or before target attacks; Once per Combat'
    description: Jump up to (X+4) squares any direction.
  - name: Purge
    type: reaction
    tags: [ ranged, arcane ]
    cost: '—'
    target-range: Party Members R7
    check: 'Condition: your turn or any target ends turn; Once per Combat'
    description: Spend Light/Dark to gain that much Energy; in-range party gain half (round up).
