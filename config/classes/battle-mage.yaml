id: battle-mage
name: Battle Mage
tier: '2'
main-stat: INT
roles: [dps, healer]
combat-modifier:
  name: Balance
  description: 'May use Double Cast un-unlocked. Restorative Magic gains Dark Charge; Magic Attack gains Light Charge. Boost for 0 Energy while Light and Dark counts match. At 3 each, spend all to cast 1 Magic for 0 Energy (no charges that way).'
prerequisites:
  - {class: wizard, level: 10}
unlocks:
  - {class: alchemist, level: 10}
  - {class: fortune-teller, level: 10}
health-mod: -5
stats:
  main: {STR: 0, DEX: 1, CON: 2, MND: 1, INT: 1, LUK: 0}
  bonus: {JMP: 1, AGL: 0, DEF: 0, RES: 0, NRG: 1, FOR: 0}
x-start: 1
ultimate:
  name: True Balance
  description: 3D6 damage to enemies and 3D6 HP to party in 5x5 line across field.
  charge:
    - use a Boost for 0 Energy
    - gain a Light Charge
    - gain a Dark Charge
    - roll a Critical
expertise-tracks:
  - {expertise: Dexterity, value: 1, unlock-at: 2}
  - {expertise: Bravado, value: 1, unlock-at: 4}
equipment:
  main-hand: Slashing or Focus Sword
  armor: Heavy Armor
  off-hand: Shield
passives:
  - {name: Mind, Body, and Soul, kind: non-combat, slot: passive, target: self, condition: Non-Combat STR/DEX/MND/INT check, use: constant, description: Swap STR/DEX checks to MND/INT or vice versa., locked: false}
  - {name: Parry Sword, kind: combat, slot: passive, target: self, condition: attacked while holding Sword, use: passive, description: 'Roll D20, beat attack total to take no damage; once per round.', locked: false}
  - {name: Double Cast, kind: combat, slot: passive, target: self, condition: unlock all, use: constant, description: 'Once per round with Magic ability, cast any 2 Magic abilities as 1 instead (may repeat one); pay energy as followed.', locked: true}
  - {name: Intellectual, kind: combat, slot: stat, target: self, condition: unlock all, use: always-on, description: +1 permanent INT., locked: true}
actions:
  main:
    - {name: Defiance, tags: [melee, physical], cost: '—', target-range: T1 R1, check: 'D20+DEX vs DEF, Chain: X damage Jump up to 5 carrying 1-square target; Boost jump 7 ignore verticality', description: 'DEX damage; Jump up to 5 from target; Stagger +XD6.'}
    - {name: Arcane Missile, tags: [ranged, arcane], cost: 'Energy 5, Boost: 5x5 within 10 instead', target-range: T1 R7, check: 'D20+INT vs DEF', description: 'Gain 1 Light; spend up to 1 Dark for +XD6; INT damage; Stagger +XD6.'}
    - {name: Holy Touch, tags: [melee, restorative, holy], cost: 'Energy 4, Boost: 5x5 on target instead', target-range: Self or 1 R1, check: Critical, description: 'Gain 1 Dark; spend up to 1 Light for +XD6 restored; restores (X+2)D6 + MND.'}
    - {name: Ultra Beam, tags: [ranged, arcane, holy, restorative], cost: 'Energy 6, Boost: 5x5 straight line across whole field', target-range: 3x3 straight line, check: 'D20+INT vs DEF', description: 'Spend ALL charges (+1D6 dealt/+1D6 restored per charge); 1D6+INT to enemies, 1D6+MND to allies.'}
  support:
    - {name: Restore, tags: [ranged, restorative, holy], cost: 'Energy 4, Boost: also remove 1 Status incl KO', target-range: Self or 1 R7, check: Critical, description: 'Gain 1 Dark; spend 1 Light for +MND restored; restores XD6 + MND.'}
    - {name: Vex Blade, tags: [melee, arcane], cost: 'Energy 4, Boost: +XD6', target-range: T1 R1, check: 'D20+INT vs RES', description: 'Gain 1 Light; spend 1 Dark to inflict Weak (3); INT damage; Expose Daze.'}
    - {name: Force, tags: [arcane], cost: 'Energy 4, Boost: range/push +INT', target-range: Target 1 Range DEX, check: '—', description: 'Spend 1 Light/Dark for range/push +MND; Push 1-square target DEX squares away, or Pull square target DEX squares close.'}
    - {name: Charge Up, tags: [magic], cost: 'Boost: gain 1 Light AND 1 Dark', target-range: Self, check: '—', description: Gain 1 Light or 1 Dark Charge.}
  reactions:
    - {name: Evasive Maneuvers, tags: [physical], cost: '—', target-range: Self, check: 'Condition: your turn or before target attacks; Once per Combat', description: Jump up to (X+4) squares any direction.}
    - {name: Purge, tags: [ranged, arcane], cost: '—', target-range: Party Members R7, check: 'Condition: your turn or any target ends turn; Once per Combat', description: Spend Light/Dark to gain that much Energy; in-range party gain half (round up).}
source-pages: [p074]
notes: Health -5 as printed. Main stats 4 boxes as printed (1 DEX/2 CON/1 MND/1 INT). Bonus 1 JMP/1 NRG as printed. Sheet tracks Light and Dark charges.
