# source: p048
# note: Example sheet vision-transcribed p048; only finished ability text in book.

id: soldier
name: Soldier
roles: [ dps, tank ]
main-stat: str
tier: starter
x-start: 1

prerequisites: []

expertise-modifiers:
  - strength: 1
    requirements: [ class-lvl: 2 ]
  - perception: 1
    requirements: [ class-lvl: 4 ]

stat-modifiers:
  - max-hp: 0
  - str: 2
  - con: 1
  - mnd: 1
  - def: 2
  - res: 2

equipment:
  - main-hand: Slashing Sword
  - armor: Heavy Armor
  - off-hand: Shield

combat-modifier:
  - name: Soldier's Duty
  - description: 'MAX HP equals double CON. Inspired attacking from side or behind in melee. Uses Marching Drills even un-unlocked. Physical Melee All-Rounder.'

ultimate:
  - name: Valor Strike
  - description: Deal 50% damage to an adjacent target.
  - charge:
    - attack from side/behind
    - Chain
    - Stagger/Expose
    - roll a Critical

passives:
  - name: Military Knowledge
    target: self
    requirements: [ non-combat ]
    description: Inspired on Military Knowledge.
  - name: Slashing Weapon Proficiency
    target: self
    requirements: [ in-combat, constant ]
    description: 'Equip Slashing with any class; physical melee +X damage.'
  - name: Marching Drills
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 JMP/AGL.
  - name: Stronger
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent STR, always on even without the card.

actions:
  - name: Enraged Swing
    type: main
    tags: [ melee, physical, attack ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF, Chain STR'
    description: 'STR damage; Stagger +XD6; Critical refunds a Heightened Senses slot; Charge +X damage.'
  - name: Throw Rock
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R5
    check: 'STR vs DEF'
    description: 'STR damage, Provoked; Stagger inflicts Berserk.'
  - name: Rally Call
    type: main
    tags: [ melee, restorative, magic ]
    cost: 'Energy 2/6, Boost: triple HP'
    target-range: T1 R1
    check: '—'
    description: Lose half current HP (round down); target restores double HP lost.
  - name: Double Slash
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'STR vs DEF, Chain STR, Charge range +1'
    description: 'STR damage; Stagger +XD6; Critical refunds Heightened Senses; Charge range +X.'
  - name: Charge
    type: support
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R3
    check: 'D20+DEX vs DEF'
    description: 'Move adjacent between you and target; X damage, lose damage/range bonuses; shield +X; Stagger +STR.'
  - name: Healing Herbs
    type: support
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: '—'
    description: Remove all Status Effects.
  - name: War Cry
    type: support
    tags: [ magic ]
    cost: 'Energy 2/6, Boost: 3x3 centered on self, Once per Combat'
    target-range: Self
    check: '—'
    description: '+(X+1) AGL, reduce physical damage by (X+1), deal +(X+1) damage till end of round.'
  - name: Bolster
    type: support
    tags: [ melee, physical ]
    cost: 'Energy 3/6, Boost: restore MND x STR HP'
    target-range: Self or 1 R1
    check: '—'
    description: '+(X+2) DEF; target only damaged by attacks while Staggered.'
  - name: Heightened Senses
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Condition: your turn or before attacking; Twice per Combat'
    description: Abilities +(X+1) damage this round.
  - name: Counter Bash
    type: reaction
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'Condition: after being attacked; Once per Combat; roll D6'
    description: 1 or 6 deals STR damage back; shield +X.
