# source: p084
# note: Main stats 2 STR/2 CON/1 INT and bonus 2 DEF/1 RES as printed. Kogeki is combat-start stance.

id: samurai
name: Samurai
roles: [ tank, dps ]
main-stat: con
tier: 2
x-start: 1

prerequisites:
  - class: knight
    level: 10

expertise-modifiers:
  - constitution: 1
    requirements: [ class-lvl: 2 ]
  - concentration: 1
    requirements: [ class-lvl: 4 ]

stat-modifiers:
  - max-hp: 5
  - str: 2
  - con: 2
  - int: 1
  - def: 2
  - res: 1

equipment:
  - main-hand: Slashing 2H Sword
  - armor: Heavy Armor
  - off-hand: none (2-hander uses both slots)

combat-modifier:
  - name: Kamae
  - description: 'All attacks Provoke. MAX HP equals double CON. Start in Kogeki Stance. Kogeki: Reactions trigger on targets entering 5x5 on you, all attacks +X. Boei: Reactions counter melee attackers, enemy abilities -X. Uses Two-Handed passive un-unlocked.'

ultimate:
  - name: Severance Blade
  - description: Defeat 1 adjacent non-boss target or deal 5D6.
  - charge:
    - Stagger/Expose
    - change stances
    - Provoke 2 enemies
    - roll a Critical

passives:
  - name: Stoicism
    target: self
    requirements: [ non-combat, constant ]
    description: Attackers roll at Disadvantage.
  - name: Opportune Strike
    target: T1 R1
    requirements: [ in-combat, target-leaves ]
    description: X + STR damage.
  - name: Melee (2-Handed) Weapon Proficiency
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: 'Wield any melee 2-handed across both slots; physical melee deal 1D6 + X.'
  - name: Built to Last
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent CON.

actions:
  - name: Kogeki Kamae
    type: main
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Chain: enter Kogeki Stance'
    description: Enter Kogeki; incomers trigger Kogeki Reaction; ranges double this round.
  - name: Boei Kamae
    type: main
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Chain: enter Boei Stance'
    description: Enter Boei; melee attackers trigger Boei Reaction; Boei Reactions +X SC this round.
  - name: Coin Toss
    type: support
    tags: [ ranged, physical ]
    cost: spend up to $300
    target-range: T1 R5
    check: '—'
    description: '$10:1 $20:2 $30:3 $40:5 $50:7 $60:10 $70:13 $80:17 $90:21 $100:26 $120:31 $140:37 $160:43 $180:50 $200:57 $220:65 $240:73 $260:82 $280:97 $300:100.'
  - name: Mabushi-sa
    type: support
    tags: [ ranged, physical ]
    cost: 'Boost: target deals -X this round'
    target-range: T1 R5
    check: '—'
    description: 'Inflict Taunt; Stagger checks -(X+1) this round.'
  - name: Reverse Blade
    type: support
    tags: [ melee, physical ]
    cost: '—'
    target-range: 3x3 centered on self
    check: 'D20+CON vs RES'
    description: 'STR to all; Expose Berserk.'
  - name: Mukonisuru
    type: support
    tags: [ melee, physical ]
    cost: 'Boost: Stunned instead; Successfully Once per Combat'
    target-range: T1 R1
    check: 'D20+CON vs RES'
    description: Expose Disable.
  - name: Nerve Ender
    type: reaction
    tags: [ kogeki, melee, magic ]
    cost: Energy 5
    target-range: 5x5 centered on self
    check: 'D20+STR vs DEF; Condition: target moves into range'
    description: 'STR damage, enter Boei; Stagger +XD6 and Weak (X-2).'
  - name: True Release
    type: reaction
    tags: [ kogeki, melee, physical ]
    cost: Energy 5
    target-range: 5x5 centered on self
    check: 'D20+STR vs DEF; Condition: target moves into range'
    description: 'STR damage, slip 1 behind; Stagger +XD6 and Ruin (3).'
  - name: Sanguine Grasp
    type: reaction
    tags: [ boei, melee, magic ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF; Condition: after being attacked in melee'
    description: 'STR damage, heal it back, enter Kogeki; Stagger +XD6.'
  - name: Dismantle Posture
    type: reaction
    tags: [ boei, melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF; Condition: after being attacked in melee'
    description: 'STR damage; successful Stagger (when their attack did not Stagger you) also Knocks Prone; enter Kogeki; Stagger +XD6.'
