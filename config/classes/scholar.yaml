# source: p056
# note: Main Actions and Support Actions boxes blank templates in source — combat abilities not yet written as-printed.

id: scholar
name: Scholar
roles: [ specialist ]
main-stat: mnd
tier: starter
x-start: 1
max-hp-mode: normal

prerequisites: []

expertise-modifiers:
  - expertise: knowledge
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: perception
    value: 1
    requirements:
      - kind: class-level
        level: 2

stat-modifiers:
  max-hp: 0
  dex: 1
  mnd: 2
  int: 1
  def: 2
  res: 1
  for: 1

equipment:
  main-hand: Focus Tome
  armor: Light Armor
  off-hand: Shield

combat-modifier:
  name: Knowledge is Power
  description: 'Learn abilities from enemies via Study reaction. Track on Tomes of Knowledge sheets; put ALL learned abilities there. Before encounter Activate Tome abilities up to unlocked Scholar count (works as subclass too). Learned abilities use MND for checks and damage.'

ultimate:
  name: Focused Studies
  description: Learn all abilities from an enemy; immediately use any 1 ability from Tome of Knowledge.
  charge:
    - Examine an enemy
    - use an enemy ability
    - learn an enemy ability
    - roll a Critical

passives:
  - name: Perceptive
    target: self
    requirements:
      - kind: non-combat
      - kind: constant
    description: Inspired on Perception.
  - name: Light Armor Proficiency
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: Equip Light with any class; RES and JMP +1.
  - name: Double Major
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: Class levels may go into locked Sub-Class abilities.
  - name: Mindful
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent MND.

actions:
  - name: Study
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: T1 R10
    check: 'D20+MND vs RES; Condition: after enemy uses Main or Support ability'
    description: Learn it into Tomes of Knowledge (GM details it; once per enemy per encounter).
  - name: Examine
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: T1 R10
    check: 'Condition: once per target, start or end of its turn; once per round per target'
    description: Learn 1 info (HP, conditions, stats, weaknesses, resistances).
