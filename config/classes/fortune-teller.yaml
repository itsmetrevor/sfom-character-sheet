# source: p102
# note: Prereq Trickster LVL 5 chart vs sheet header Trickster LVL 15 — chart authoritative per notes, use 5. Single expertise track unlock 3. Sheet tracks 3 Psychic Charges.

id: fortune-teller
name: Fortune Teller
roles: [ specialist ]
main-stat: luk
tier: 4
x-start: 1

prerequisites:
  - class: trickster
    level: 5
  - class: battle-mage
    level: 10
  - class: bard
    level: 10

expertise-modifiers:
  - luck: 1
    requirements: [ class-lvl: 3 ]

stat-modifiers:
  - max-hp: -5
  - mnd: 1
  - int: 1
  - luk: 2
  - agl: 1
  - res: 2
  - for: 1

equipment:
  - main-hand: Focus or Instrument
  - armor: Light Armor
  - off-hand: Dagger

combat-modifier:
  - name: Psychic Readings
  - description: 'Passed checks from Card Reading gain Psychic Charge. Spend charges to hand-pick Tarot Deck cards instead of flipping (shuffle before further flips). Card effects use your stats and D6 rolls. Magic Ranged Wild Card.'

ultimate:
  - name: Intertwined Fate
  - description: Make a Card Reading where all checks succeed, hitting all party members and all enemies.
  - charge:
    - use a Fortune Die
    - use Card Reading
    - succeed all 3 flipped cards
    - roll a Critical

passives:
  - name: Prediction
    target: self
    requirements: [ non-combat, well-rested ]
    description: Draw 3 Tarot cards for GM fortune reading.
  - name: Fortunate
    target: T1 enemy R5
    requirements: [ in-combat, constant ]
    description: '+1 FOR; Fortune Die floor of 3. Check D20+LUK vs RES.'
  - name: Serendipitous
    target: Self or 1 R5
    requirements: [ in-combat, class-adept, once-per-round ]
    description: Roll D6 to raise or lower one check per round.
  - name: Lucky
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent LUK.

actions:
  - name: Card Reading
    type: main
    tags: [ ranged, magic ]
    cost: Energy 5
    target-range: T1 R5
    check: '—'
    description: 'Flip 3 Tarot cards — allies top effects, enemies bottom; non-status/DOT shed at round end as cards shuffle back. Unlocks: Queen of Cups, Lovers, Hanged Man, Death, Sun, Moon. Starting deck: Fool, Wheel of Fortune, Star, Emperor, King of Wands, Knight of Swords.'
  - name: Luck or Misfortune
    type: support
    tags: [ ranged, magic ]
    cost: Energy 5
    target-range: T1 R5
    check: '—'
    description: 'Flip for party member (keeps card on passed check till end of round) or enemy (same check vs them).'
  - name: Alter Fate
    type: support
    tags: [ magic ]
    cost: 'Energy 5, Boost: bottom cards instead of shuffling'
    target-range: Self
    check: '—'
    description: After Card Reading before effects, re-shuffle flipped and flip replacements.
  - name: Rewrite the Future
    type: reaction
    tags: [ ranged, magic ]
    cost: '—'
    target-range: T1 R5
    check: 'Condition: start of enemy turn; Once per Combat'
    description: Card Reading against them on their own turn.
  - name: Destiny
    type: reaction
    tags: [ ranged, magic ]
    cost: '—'
    target-range: T1 R5
    check: 'Condition: after using Card Reading; Once per Combat'
    description: Gift one flipped card effect to target, refreshing every round start till combat end.
