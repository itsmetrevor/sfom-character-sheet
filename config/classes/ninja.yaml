# source: p082
# note: Jutsu listed under Main in source; spend Chakra on your turn, not Main/Support/Reaction.

id: ninja
name: Ninja
roles: [ dps, specialist ]
main-stat: dex
tier: 2
x-start: 1

prerequisites:
  - class: thief
    level: 10

expertise-modifiers:
  - thievery: 1
    requirements: [ class-lvl: 2 ]
  - stealth: 1
    requirements: [ class-lvl: 4 ]

stat-modifiers:
  - max-hp: 0
  - dex: 2
  - mnd: 1
  - luk: 1
  - jmp: 1
  - def: 1
  - res: 1

equipment:
  - main-hand: Piercing Dagger
  - armor: Medium Armor
  - off-hand: Dagger

combat-modifier:
  - name: Ninja-Arts
  - description: 'Uses Dual Wield un-unlocked. Main Actions unlock specific Chakra (tracked symbols); spend Chakra on Jutsu during your turn. Jutsu are not Main/Support/Reaction. Frog Summons 2x AGL and 1+X JMP, act at end of owner turn, resummonable, one at a time, owner-controlled.'

ultimate:
  - name: The Seventh Gate
  - description: Fill all your Chakras.
  - charge:
    - use 2 Main Actions
    - use a Jutsu
    - attack from behind
    - roll a Critical

passives:
  - name: From the Shadows
    target: self
    requirements: [ non-combat ]
    description: Inspired on Stealth.
  - name: Agility & Balance
    target: self
    requirements: [ in-combat, constant ]
    description: Liquid counts as regular squares; walls walkable but not endable.
  - name: Dual-Wield
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: 'Wield second Main-Hand in Off-Hand with both effects; once per turn use Main Action as Support Action.'
  - name: Dexterous
    target: self
    requirements: [ in-combat, class-adept, constant ]
    description: +1 permanent DEX.

actions:
  - name: Suraisu
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+DEX vs RES, Chain: X damage gain Chakra'
    description: 'Gain Chakra; DEX damage; Expose Bleed DOT 3.'
  - name: Shuriken
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R7
    check: 'D20+DEX vs DEF, Chain: X damage gain Chakra'
    description: 'Gain Chakra; DEX damage; Stagger +XD6.'
  - name: Setsudan Suru
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+DEX vs RES, Chain: X damage gain Chakra'
    description: 'Gain Chakra; DEX damage; teleport adjacent; Expose Confused.'
  - name: Bakkusutabu
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+DEX vs DEF, Chain: X damage; Back Attack DEX damage'
    description: 'Gain Chakra; DEX damage; Stagger +XD6; Back Attack +1D6.'
  - name: 'Jutsu: Frog Summon'
    type: main
    tags: [ ranged, jutsu, magic, summon ]
    cost: 2 same Chakra
    target-range: Square R5
    check: '—'
    description: 'Summon Ninja Frog — Tanku (Enmity 3x3 on self; 20HP DEF/RES 15+X), Dameiji (XD6 in 3x3; 15HP 11+X), Hira (restore XD6 in 3x3; 10HP 9+X).'
  - name: 'Jutsu: Water Throwing Star'
    type: main
    tags: [ ranged, elemental, water, jutsu ]
    cost: 'Boost: spend 1 Chakra for +1 star'
    target-range: T1 R7
    check: 'D20+MND vs DEF'
    description: 'MND damage plus Wet; Stagger XD6.'
  - name: 'Jutsu: Wind Storm'
    type: main
    tags: [ ranged, elemental, wind, jutsu ]
    cost: 'Boost: spend 1 Chakra for 5x5 within 10'
    target-range: Square 3x3 within 5
    check: 'D20+MND vs RES'
    description: 'MND to each; Expose Wind DOT 5.'
  - name: 'Jutsu: Earth Pillars'
    type: main
    tags: [ ranged, elemental, earth, jutsu ]
    cost: 'Boost: spend 1 for +1 pillar up to 3 high'
    target-range: Square 3x1 within 5
    check: '—'
    description: 'Raise three 1x3 pillars as Wall (not under 2x2+; 1x1 victims Prone). 1x1 2HP, 1x2 5HP, 1x3 10HP.'
  - name: Smoke Bomb
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Square 3x3 within 5
    check: 'Condition: your turn or before party member attacked; Once per Combat'
    description: '3x3 Smoke Cloud till end of round — others inside gain Blind, Slow, +1 AGL per square moved.'
  - name: Chakra Pool
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Condition: your turn; Twice per Combat'
    description: Gain 1 Chakra of choice.
