id: rune-knight
name: Rune Knight
tier: '4'
main-stat: CON
roles: [tank, dps]
combat-modifier:
  name: Runic Blessing
  description: 'All attacks Provoke. MAX HP equals double CON. Main/Support activate specific Rune; spend 3 different Active Runes around any action for Runic Circle Reaction. Riders: diamond-1 +2 DEF; diamond-bar receive -X; diamond-slash +2 RES; diamond-dash gain Drain (X). Magic Melee/Ranged Provoker All-Rounder. (Modifier header prints Necromancy as-printed — use Runic Blessing per sheet.)'
prerequisites:
  - {class: gladiator, level: 15}
  - {class: ninja, level: 10}
  - {class: paladin, level: 10}
unlocks:
  - {class: shard-bearer, level: 10}
health-mod: 5
stats:
  main: {STR: 0, DEX: 0, CON: 2, MND: 2, INT: 1, LUK: 0}
  bonus: {JMP: 0, AGL: 0, DEF: 2, RES: 1, NRG: 0, FOR: 0}
x-start: 1
ultimate:
  name: Circle of Pain
  description: Provoke all enemies and gain each Rune; entrants to Runic Circle take 3D6 this round.
  charge:
    - use or inflict a Status Effect
    - gain a Rune
    - survive unstaggered
    - roll a Critical
expertise-tracks:
  - {expertise: Crafting, value: 1, unlock-at: 3}
equipment:
  main-hand: Slashing or Piercing Sword
  armor: Heavy Armor
  off-hand: Shield
passives:
  - {name: Sigils, kind: non-combat, slot: passive, target: T1 R1, condition: Non-Combat, use: Once per Long Rest, description: 'Plant 1 Sigil till next Long Rest — eye (trackable sensor anywhere), I (alerts on entering sight), line (usable 3rd eye).', locked: false}
  - {name: Ward, kind: combat, slot: passive, target: self, condition: constant, use: constant, description: Immune to forced movement, pass-through, and prone from abilities., locked: false}
  - {name: Barrier, kind: combat, slot: passive, target: self, condition: unlock all, use: constant, description: Attacks deal -X to you., locked: true}
  - {name: Built to Last, kind: combat, slot: stat, target: self, condition: unlock all, use: always-on, description: +1 permanent CON., locked: true}
actions:
  main:
    - {name: Glyph Slash, tags: [melee, physical], cost: '—', target-range: T1 R1, check: 'D20+CON vs DEF, Chain: gain 1 Rune + MND damage', description: 'Gain 1 Rune; MND damage; Stagger +XD6; Circle targets gain Weak (3).'}
    - {name: Runic Defense, tags: [arcane], cost: 'Energy 5, Boost: +3 DEF +3 RES', target-range: Self, check: '—', description: 'Gain 1 Rune; only Staggering attackers damage you; Circles restore XD6+MND.'}
    - {name: Mystic Attack, tags: [ranged, physical], cost: '—', target-range: T1 R10, check: 'D20+CON vs DEF, Chain: gain 1 Rune + MND damage', description: 'Gain 1 Rune; MND damage; Stagger +XD6; Circle targets gain Sleep.'}
    - {name: Dimensional Circle, tags: [melee, arcane], cost: 'Energy 5, Boost: 5x5 on self + X per Active Rune', target-range: Self-centered 3x3, check: 'D20+CON vs DEF', description: 'Gain 1 Rune; MND damage with X-square push; Stagger +XD6 (+XD6 more for obstacle collisions in Circle).'}
  support:
    - {name: Rune of Compulsion, tags: [ranged, arcane], cost: 'Boost: any range', target-range: T1 R5, check: 'D20+CON vs RES', description: 'Gain 1 Rune + Provoke; Expose Weak (3).'}
    - {name: Runic Power, tags: [ranged, arcane], cost: 'Boost: any range', target-range: T1 R5, check: '—', description: 'Gain 2 Runes and spend any — each buys one Fear (You), or 1D6 per Rune to every target inside Runic Circle.'}
    - {name: Astral Wall, tags: [ranged, arcane], cost: 'Energy 5, Boost: five 1x1 pillars', target-range: Square 3x1 within 5, check: '—', description: 'Gain 1 Rune; 3x1 indestructible wall till end of round; Circles tax adjacent movement +1 AGL.'}
    - {name: Wings of Ascension, tags: [arcane], cost: 'Boost: +X AGL', target-range: Self, check: '—', description: 'Gain 1 Rune + Flying (Flying (2) in Circle) till end of round.'}
  reactions:
    - {name: 'Runic Circle: Restriction', tags: [physical], cost: spend 3 different Active Runes, target-range: Square/Range 5x5 within 10, check: 'Condition: around any action', description: Enemies frozen in/out till end of round.}
    - {name: 'Runic Circle: Light', tags: [physical], cost: spend 3 different Active Runes, target-range: Square/Range 5x5 within 10, check: 'Condition: around any action', description: Allies Inspired, enemies Blind.}
    - {name: 'Runic Circle: Mending', tags: [physical], cost: spend 3 different Active Runes, target-range: Square/Range 5x5 within 10, check: 'Condition: around any action', description: Enemy damage inside heals allies inside.}
    - {name: 'Runic Circle: Protection', tags: [physical], cost: spend 3 different Active Runes, target-range: Square/Range 5x5 within 10, check: 'Condition: around any action', description: Spend your DEF/RES to absorb allies damage and statuses.}
source-pages: [p108]
notes: Single track unlock 3. Combat modifier header prints Necromancy as-printed; abilities use Runic Blessing/Circles.
