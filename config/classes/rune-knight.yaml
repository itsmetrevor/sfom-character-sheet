# source: p108
# note: Single track unlock 3. Combat modifier header prints Necromancy as-printed; abilities use Runic Blessing/Circles.

id: rune-knight
name: Rune Knight
roles: [ tank, dps ]
main-stat: con
tier: tier-4
x-start: 1
max-hp-mode: double-con

prerequisites:
  - kind: class
    class: gladiator
    level: 15
  - kind: class
    class: ninja
    level: 10
  - kind: class
    class: paladin
    level: 10

expertise-modifiers:
  - expertise: crafting
    value: 1
    requirements:
      - kind: class-level
        level: 3

stat-modifiers:
  max-hp: 5
  con: 2
  mnd: 2
  int: 1
  def: 2
  res: 1

equipment:
  main-hand: Slashing or Piercing Sword
  armor: Heavy Armor
  off-hand: Shield

combat-modifier:
  name: Runic Blessing
  description: 'All attacks Provoke. MAX HP equals double CON. Main/Support activate specific Rune; spend 3 different Active Runes around any action for Runic Circle Reaction. Riders: diamond-1 +2 DEF; diamond-bar receive -X; diamond-slash +2 RES; diamond-dash gain Drain (X). Magic Melee/Ranged Provoker All-Rounder. (Modifier header prints Necromancy as-printed — use Runic Blessing per sheet.)'

ultimate:
  name: Circle of Pain
  description: Provoke all enemies and gain each Rune; entrants to Runic Circle take 3D6 this round.
  charge:
    - use or inflict a Status Effect
    - gain a Rune
    - survive unstaggered
    - roll a Critical

passives:
  - name: Sigils
    target: T1 R1
    requirements:
      - kind: non-combat
      - kind: well-rested
    description: 'Plant 1 Sigil till next Long Rest — eye (trackable sensor anywhere), I (alerts on entering sight), line (usable 3rd eye).'
  - name: Ward
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: Immune to forced movement, pass-through, and prone from abilities.
  - name: Barrier
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: Attacks deal -X to you.
  - name: Built to Last
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent CON.

actions:
  - name: Glyph Slash
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+CON vs DEF, Chain: gain 1 Rune + MND damage'
    description: 'Gain 1 Rune; MND damage; Stagger +XD6; Circle targets gain Weak (3).'
  - name: Runic Defense
    type: main
    tags: [ arcane ]
    cost: 'Energy 5, Boost: +3 DEF +3 RES'
    target-range: Self
    check: '—'
    description: 'Gain 1 Rune; only Staggering attackers damage you; Circles restore XD6+MND.'
  - name: Mystic Attack
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R10
    check: 'D20+CON vs DEF, Chain: gain 1 Rune + MND damage'
    description: 'Gain 1 Rune; MND damage; Stagger +XD6; Circle targets gain Sleep.'
  - name: Dimensional Circle
    type: main
    tags: [ melee, arcane ]
    cost: 'Energy 5, Boost: 5x5 on self + X per Active Rune'
    target-range: Self-centered 3x3
    check: 'D20+CON vs DEF'
    description: 'Gain 1 Rune; MND damage with X-square push; Stagger +XD6 (+XD6 more for obstacle collisions in Circle).'
  - name: Rune of Compulsion
    type: support
    tags: [ ranged, arcane ]
    cost: 'Boost: any range'
    target-range: T1 R5
    check: 'D20+CON vs RES'
    description: 'Gain 1 Rune + Provoke; Expose Weak (3).'
  - name: Runic Power
    type: support
    tags: [ ranged, arcane ]
    cost: 'Boost: any range'
    target-range: T1 R5
    check: '—'
    description: 'Gain 2 Runes and spend any — each buys one Fear (You), or 1D6 per Rune to every target inside Runic Circle.'
  - name: Astral Wall
    type: support
    tags: [ ranged, arcane ]
    cost: 'Energy 5, Boost: five 1x1 pillars'
    target-range: Square 3x1 within 5
    check: '—'
    description: 'Gain 1 Rune; 3x1 indestructible wall till end of round; Circles tax adjacent movement +1 AGL.'
  - name: Wings of Ascension
    type: support
    tags: [ arcane ]
    cost: 'Boost: +X AGL'
    target-range: Self
    check: '—'
    description: 'Gain 1 Rune + Flying (Flying (2) in Circle) till end of round.'
  - name: 'Runic Circle: Restriction'
    type: reaction
    tags: [ physical ]
    cost: spend 3 different Active Runes
    target-range: Square/Range 5x5 within 10
    check: 'Condition: around any action'
    description: Enemies frozen in/out till end of round.
  - name: 'Runic Circle: Light'
    type: reaction
    tags: [ physical ]
    cost: spend 3 different Active Runes
    target-range: Square/Range 5x5 within 10
    check: 'Condition: around any action'
    description: Allies Inspired, enemies Blind.
  - name: 'Runic Circle: Mending'
    type: reaction
    tags: [ physical ]
    cost: spend 3 different Active Runes
    target-range: Square/Range 5x5 within 10
    check: 'Condition: around any action'
    description: Enemy damage inside heals allies inside.
  - name: 'Runic Circle: Protection'
    type: reaction
    tags: [ physical ]
    cost: spend 3 different Active Runes
    target-range: Square/Range 5x5 within 10
    check: 'Condition: around any action'
    description: Spend your DEF/RES to absorb allies damage and statuses.
