name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Format
        run: nix develop --command cargo fmt --check
      - name: Clippy
        run: nix develop --command cargo clippy --all-targets --features web -- -D warnings
      - name: Tests
        run: nix develop --command cargo test --no-default-features --lib --tests
      - name: Web build
        run: nix develop --command dx build --platform web
      - name: PWA release build
        run: nix develop --command dx build --release --platform web
