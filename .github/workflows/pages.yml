name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          rm -rf target/dx/som-v3/release/web
          nix develop --command dx build --release --platform web
          test -f target/dx/som-v3/release/web/public/index.html
          test -f target/dx/som-v3/release/web/public/sw.js
          test -f target/dx/som-v3/release/web/public/config/index.json
          test -d target/dx/som-v3/release/web/public/config/ancestries
          grep -q '/sfom-character-sheet/assets/' target/dx/som-v3/release/web/public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/som-v3/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
