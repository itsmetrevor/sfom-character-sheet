# source: p052
# note: Role not written as-printed. Expertise header in source mislabels these as Knight Expertise Specialties — transcribed as Gladiator's.

id: gladiator
name: Gladiator
roles: [ tank, dps ]
main-stat: con
tier: starter
x-start: 1
max-hp-mode: double-con

prerequisites: []

expertise-modifiers:
  - expertise: constitution
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: throw-catch
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: 5
  str: 1
  con: 2
  luk: 1
  def: 3

equipment:
  main-hand: Slashing Sword
  armor: Heavy
  off-hand: Shield

combat-modifier:
  name: Shield Drum
  description: 'All attacks inflict Provoke. MAX HP equals double CON. +X damage per target Provoked from this character. Keep Taunt until another target is taunted.'

ultimate:
  name: Provoking Shout
  description: Inflict Provoke on all enemies; receive -CON damage from all attacks this round.
  charge:
    - Stagger/Expose an enemy
    - Provoke 2+ targets
    - Taunt a target
    - roll a Critical

passives:
  - name: Throwing Skills
    target: self
    requirements:
      - kind: non-combat
      - kind: constant
    description: Inspired on Throw/Catch.
  - name: Heavy Armor Proficiency
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: Equip Heavy with any class; DEF and RES +1.
  - name: Attention!
    target: T1 R5
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: reaction
    description: 'Reaction Taunt 1 target; keep Taunt until another is taunted.'
  - name: Built to Last
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent CON.

actions:
  - name: Enraged Swing
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF, Chain STR'
    description: 'STR damage; Stagger +XD6; Taunted targets gain Berserk; Critical inflicts Confuse.'
  - name: Shield Bounce
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T2 R5
    check: 'STR vs DEF, requires shield'
    description: 'STR damage, repeat vs another within 5 of 1st; Stagger +XD6; Critical repeats vs another within 5 of 2nd.'
  - name: Rush Attack
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'STR vs DEF, Chain: move 3/1 and deal STR'
    description: 'STR damage; Stagger +XD6 and gain 1 Energy.'
  - name: Throw Javelin
    type: main
    tags: [ ranged, physical ]
    cost: Twice per Combat
    target-range: T1 R7
    check: 'D20+STR vs DEF, Chain: pull target adjacent, Javelin not lost'
    description: 'STR damage, place adjacent Javelin Marker; moving onto it regains a use; Stagger +XD6.'
  - name: Belittle
    type: support
    tags: [ ranged, physical, talk ]
    cost: '—'
    target-range: T1 R5
    check: Critical
    description: 'Taunt a non-Boss or Provoke a Boss; Critical Provokes all in 5x5 on target.'
  - name: Throw Sand
    type: support
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R3
    check: 'D20+CON vs RES'
    description: 'Expose Blind.'
  - name: Sever Magic
    type: support
    tags: [ melee, physical ]
    cost: Once per Combat
    target-range: Self
    check: Critical
    description: '-X damage received per Provoked target till next turn; Critical adds another -X.'
  - name: Shield Push
    type: support
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF'
    description: 'X damage; shield Push 3; Push damage inflicts Provoked; Stagger +STR.'
  - name: Memorized Attacks
    type: reaction
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R5
    check: 'Condition: before being attacked by Taunted/Boss-Provoked target; Twice per Combat'
    description: They roll Dizzy on Stagger/Expose vs you till end of round.
  - name: Disarm
    type: reaction
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+CON vs RES; Condition: before being attacked with Main Action; Successfully Once per Combat'
    description: 'Expose Disable; reusable this combat if Resisted.'
