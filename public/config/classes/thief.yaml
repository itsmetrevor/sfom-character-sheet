# source: p070
# note: Sheet tracks 10 Lucky Hit charges.

id: thief
name: Thief
roles: [ dps, specialist ]
main-stat: luk
tier: tier-1
x-start: 1
max-hp-mode: normal

prerequisites:
  - kind: any-starter
    level: 10

expertise-modifiers:
  - expertise: thievery
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: stealth
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: 0
  dex: 1
  int: 1
  luk: 2
  agl: 1
  def: 1
  res: 1

equipment:
  main-hand: Piercing Dagger
  armor: Medium Armor
  off-hand: Pistol or 1H Crossbow

combat-modifier:
  name: Lucky Hit
  description: 'Chaining or using Theft abilities gains 1 Lucky Hit Charge (max 10); each charge -1 to Critical-required number; reset to 0 on Critical. Physical Melee Saboteur Damage Dealer.'

ultimate:
  name: Sticky Fingers
  description: Deal 4D6 to adjacent target; steal a rare item.
  charge:
    - at start of your turn
    - steal from target
    - roll a Critical

passives:
  - name: Burglar
    target: self
    requirements:
      - kind: non-combat
      - kind: constant
    description: Inspired on Thievery.
  - name: Piercing (Melee) Proficiency
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: 'Equip Piercing (Melee) anywhere; +1 crit chance attacking from behind.'
  - name: Vital Spot
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: 'When attacking roll D6; 1 or 6 lowers crit-required number by -X.'
  - name: Lucky
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent LUK.

actions:
  - name: Shank
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+DEX vs DEF, Chain DEX'
    description: 'DEX damage; Stagger +XD6; Critical: Double Thrust deals +0DEX till end of turn.'
  - name: Throw Dagger
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R5
    check: 'D20+DEX vs DEF, Chain DEX'
    description: 'DEX damage; Stagger +XD6; Critical inflicts Disable or Immobilize.'
  - name: Double Thrust
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+DEX vs DEF, Chain: target has Bleed DOT 2'
    description: 'DEX damage; Stagger +1D6 plus Bleed DOT 2; Critical inflicts Severe (Bleed).'
  - name: Rob
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+LUK vs DEF, Chain: Reaction-use Theft ability'
    description: 'LUK damage; Stagger: Reaction-use Theft ability; Critical +5 to Theft checks this turn.'
  - name: Steal Gold
    type: support
    tags: [ melee, physical, theft ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+LUK vs RES'
    description: 'Expose — steal XD6 + LUK gold (once per enemy).'
  - name: Steal Item
    type: support
    tags: [ melee, physical, theft ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+LUK vs RES'
    description: 'Expose — LUK check to steal item if any (once per enemy).'
  - name: Charm
    type: support
    tags: [ ranged, magic, theft ]
    cost: 'Energy 4, Boost: Expose'
    target-range: T1 R5
    check: 'D20+LUK vs RES'
    description: 'Expose — humanoid gains Charmed (2), GM roleplays it.'
  - name: Lucky Die
    type: support
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: '—'
    description: 'Roll D6 to lower crit-required numbers till end of round — 1-3: -0, 4-5: -1, 6: -2.'
  - name: Nimble
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Condition: before being damaged; Once per Combat'
    description: Reduce damage taken by LUK+X till end of round.
  - name: Bad Luck
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: T1 R5
    check: 'Condition: any target begins its turn; Once per Combat'
    description: Its D20 rolls suffer -(LUK+X) this turn.
