# source: p054
# note: Health -5 as printed. Role not written as-printed.

id: ranger
name: Ranger
roles: [ dps ]
main-stat: dex
tier: starter
x-start: 1
max-hp-mode: normal

prerequisites: []

expertise-modifiers:
  - expertise: dexterity
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: nature
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: -5
  str: 1
  dex: 2
  mnd: 1
  jmp: 1
  def: 2
  res: 1

equipment:
  main-hand: Piercing 2H Bow (uses Off-Hand slot)
  armor: Medium Armor
  off-hand: none (2-hander uses both slots)

combat-modifier:
  name: Deep Impact
  description: 'Staggering attacks deal +X damage per square elevated above target. Uses Piercing (Ranged) Weapon Proficiency even un-unlocked.'

ultimate:
  name: Precise Arrow
  description: Gain full Focus; use Focus Shot; it will Stagger.
  charge:
    - gain Focus
    - Stagger
    - attack from 2+ squares above target
    - roll a Critical

passives:
  - name: Calm Creature
    target: self
    requirements:
      - kind: non-combat
      - kind: constant
    description: Inspired on Nature checks to interact with creatures.
  - name: Ranged Fighter
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: 'Ranged Physical Stagger rolls +X, +1 more per square above target.'
  - name: Piercing (Ranged) Weapon Proficiency
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
    description: 'Equip Piercing (Ranged) with any class; melee attacks may use them at Range 10 dealing only Stagger-gated damage/effects; these weapons also use Off-Hand slot.'
  - name: Dexterous
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent DEX.

actions:
  - name: Focus
    type: main
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Chain: gain 1 Focus per round'
    description: 'Bank up to 4 Focus across turns (unused actions feed it); spending on anything but Focused Shot/Aim clears it.'
  - name: Focused Shot
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R10
    check: 'D20+DEX vs DEF'
    description: 'Spend all Focus; +1 Stagger check per charge; +1D6 per Focus on Stagger; Stagger deals XD6 + DEX.'
  - name: Arrow Volley
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: Square 5x5 within 10
    check: 'D20+DEX vs DEF, Chain: 3x3 within 10 instead, DEX damage'
    description: 'DEX to all in range; Stagger +XD6.'
  - name: Targeted Shot
    type: main
    tags: [ ranged, physical ]
    cost: '—'
    target-range: T1 R10
    check: 'D20+DEX vs DEF, Chain: target inflicted with Slow'
    description: 'Expose choice — Disable or Immobilized.'
  - name: Aim
    type: support
    tags: [ dark, magic ]
    cost: '—'
    target-range: Self
    check: 'Boost: +1 crit chance and next SC'
    description: +X crit chance and next SC roll, once per ability.
  - name: Bear Trap
    type: support
    tags: [ melee, physical, trap ]
    cost: Twice per Combat
    target-range: Square R1
    check: '—'
    description: 'Place marker in empty adjacent square; movers stop, take XD6, gain Prone.'
  - name: Soothe Creature
    type: support
    tags: [ ranged, physical, talk ]
    cost: '—'
    target-range: T1 R5
    check: 'D20+DEX vs RES; Successfully Once per Combat'
    description: 'Expose Charmed (2) on a Creature; GM roleplays it; reusable if Resisted.'
  - name: Fire Arrows
    type: support
    tags: [ ranged, physical ]
    cost: Thrice per Combat
    target-range: Self
    check: '—'
    description: Next Physical Ranged gains Expose Burn DOT 5.
  - name: Reflex
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: T1 R10
    check: 'Condition: after an enemy successfully staggers; Once per Combat'
    description: Cancel that Stagger.
  - name: Concentrate
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Condition: before you attack; Once per Combat'
    description: Next attack guaranteed to Stagger.
