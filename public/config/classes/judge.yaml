# source: p104
# note: Sheet header and chart agree Soldier 15 + Chronomancer 10 + Grim Knight 10; p105 crunch-page text repeats Fortune Teller chain — disregarded, use chart+soldier header. Single track Any Expertise unlock 3. Judgements: open every combat 3 Rulings+3 Favors. Rulings: allies heal -1D6 / enemies +1D6 / allies halve AGL / enemy statuses auto-succeed / allies cannot repeat Direction / enemies +3 crit / first ability +1 Energy / channeled wait 2 party turns. Favors: party +2 range / +1 level after combat / party +1 X / guaranteed common reward / party +1 energy Status Steps / +5 LUK defeat / diagonal move / x2 gold.

id: judge
name: Judge
roles: [ dps, specialist ]
main-stat: str
tier: tier-4
x-start: 1
max-hp-mode: normal

prerequisites:
  - kind: class
    class: soldier
    level: 15
  - kind: class
    class: chronomancer
    level: 10
  - kind: class
    class: grim-knight
    level: 10

expertise-modifiers:
  - expertise: any
    value: 1
    requirements:
      - kind: class-level
        level: 3

stat-modifiers:
  max-hp: 0
  str: 2
  con: 1
  int: 1
  def: 2
  res: 2

equipment:
  main-hand: Slashing or Bludgeoning Sword
  armor: Medium Armor
  off-hand: Pistol or Crossbow

combat-modifier:
  name: Law & Order
  description: 'Abilities can Create and Declare any followable Law fitting fight (e.g. melee range +3, or no damage without Staggering). Laws bind everyone able to follow. Always open with 3 Rulings + 3 Favors active. Activating Ruling under Judgements also selects Favor; both persist while Active. Uses Assignment un-unlocked. Physical Melee/Ranged Damage Dealer, Support, Saboteur.'

ultimate:
  name: Transgression
  description: X damage per active Ruling to each enemy; create and declare a Law till end of round; enemies only.
  charge:
    - declare a Law
    - activate a Ruling
    - deactivate a Ruling
    - roll a Critical

passives:
  - name: Sense of Justice
    target: self
    requirements:
      - kind: non-combat
      - kind: constant
    description: Know every local law.
  - name: Arbiter
    target: self
    requirements:
      - kind: in-combat
      - kind: once-per-round
      - kind: constant
    description: Reorder turn order once per round.
  - name: Assignment
    target: all party
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: once-per-combat
    description: 'Before combat, party may pre-move STR from their starts.'
  - name: Stronger
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent STR.

actions:
  - name: Judge
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF, Chain: X damage activate 1 Ruling + 1 Favor'
    description: 'Activate 1 Ruling + 1 Favor; STR damage; Stagger +XD6 plus +1 per active Ruling.'
  - name: Hammer of Justice
    type: main
    tags: [ melee, physical ]
    cost: '—'
    target-range: T1 R1
    check: 'D20+STR vs DEF, Chain: X damage deactivate 1 Ruling + 1 Favor'
    description: 'Deactivate 1+1; STR damage; Stagger +XD6 plus +1 per non-active Ruling.'
  - name: Order
    type: main
    tags: [ ranged, magic ]
    cost: 'Energy 5, Boost: activate 1 Ruling + 1 Favor'
    target-range: All any range
    check: '—'
    description: Create and declare 1 Law till end of round for everyone on field.
  - name: Executioner
    type: main
    tags: [ ranged, magic ]
    cost: 'Energy 5, Chain: X damage deactivate 1 Ruling + 1 Favor'
    target-range: T1 R5
    check: 'D20+STR vs DEF'
    description: 'STR+Xd6; Stagger +1D6 per 2 active Rulings; 5+ active inflicts Sever (Main (1)); then deactivate 3 Rulings + 3 Favors.'
  - name: Ordinance
    type: support
    tags: [ magic ]
    cost: 'Boost: Inspired on next attack'
    target-range: Self
    check: '—'
    description: Activate 1 Ruling and 1 Favor.
  - name: Justified Disobedience
    type: support
    tags: [ ranged, magic ]
    cost: 'Energy 5, Boost: activate/deactivate 1 Ruling + 1 Favor'
    target-range: Self or 1 R5
    check: '—'
    description: Target ignores current Rulings/Laws till end of round.
  - name: Jury
    type: support
    tags: [ ranged, magic ]
    cost: 'Energy 5, Boost: Guilty Ruin 3 / Innocent Quick'
    target-range: T1 R5
    check: '—'
    description: 'Everyone else rolls D6 — majority Guilty inflicts chosen Hex (1-3), majority Innocent grants Inspired (4-6).'
  - name: Scales of Justice
    type: support
    tags: [ ranged, magic ]
    cost: 'Energy pool, Once per Combat; Condition: Judge+Jury+Executioner used'
    target-range: All any range
    check: 'D20+STR vs RES'
    description: 'Enemies take STR+(X+1)D6 and Dizzy; allies restore STR+(X+1)D6 and Inspired.'
