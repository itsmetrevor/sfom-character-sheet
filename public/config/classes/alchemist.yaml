# source: p086
# note: Main stats 1 LUK/2 DEX/1 INT and bonus 1 AGL/1 DEF/1 RES as printed. Sheet tracks 5 mix slots plus flask.

id: alchemist
name: Alchemist
roles: [ dps, healer, specialist ]
main-stat: int
tier: tier-3
x-start: 1
max-hp-mode: normal

prerequisites:
  - kind: class
    class: chemist
    level: 15
  - kind: class
    class: battle-mage
    level: 10

expertise-modifiers:
  - expertise: intelligence
    value: 1
    requirements:
      - kind: class-level
        level: 2
  - expertise: crafting
    value: 1
    requirements:
      - kind: class-level
        level: 4

stat-modifiers:
  max-hp: 0
  dex: 2
  int: 1
  luk: 1
  agl: 1
  def: 1
  res: 1

equipment:
  main-hand: Ranged Piercing Pistol
  armor: Medium
  off-hand: Dagger

combat-modifier:
  name: Advanced Alchemy
  description: 'Spend multiple items combining into one. +5 ingredients from Chemistry. Spending via Alchemy-Mix: roll D6 — 6 item works without being spent. Final Mix effects end with combat. Physical Ranged All-Rounder.'

ultimate:
  name: Philosopher's Stone
  description: Use all 3 catalysts and add x enhancements to next Alchemy-Mix without spending items.
  charge:
    - add an Enhancement
    - throw an item
    - use Alchemy-Mix
    - roll a Critical

passives:
  - name: Equivalent Exchange
    target: 1 1-square-or-smaller target
    requirements:
      - kind: non-combat
      - kind: well-rested
    description: Reshape object keeping materials and mass.
  - name: Quick Mix
    target: self
    requirements:
      - kind: in-combat
      - kind: constant
    description: 'Once per turn, 2 spent items count as 1.'
  - name: Chemical Enhancement
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: 'Used items hit harder — healing/damage +X, statuses +1 round, DOTs +2.'
  - name: Intellectual
    target: self
    requirements:
      - kind: in-combat
      - kind: class-adept
      - kind: constant
    description: +1 permanent INT.

actions:
  - name: Alchemy-Mix
    type: main
    tags: [ ranged, throwing, item, physical, restorative ]
    cost: spend items
    target-range: Self
    check: '—'
    description: 'Start mixing along arrows; fresh Final Mix used immediately. Spend 2 items for Steps 1+2 (2 for Step 1 skips Step 2). S1 Restorative/ Damage(+1)/ Status(+1)/ Curative(+1). S2 Elemental (immunity or XD6) / Gear (DEF&RES+3 or reduce dealt 3) / Weapon (halve type or +XD6). S3 Enhancements (Restorative +INT, Damage +INT, Elemental +INT, status +-1 / DOT+2, weapons +1D6, gear -2). S4 Catalysts: Unfettered (1 survives), Compound (5x5), Surge (+XD6+INT). S5 Final Mix Self/1/Square R10 used now.'
  - name: Efficiency
    type: support
    tags: [ physical, item ]
    cost: Twice per Combat
    target-range: Self
    check: '—'
    description: 1 chosen item survives this round Final Mix crafting.
  - name: Bag of Many Things
    type: support
    tags: [ physical, item ]
    cost: '—'
    target-range: Self
    check: '—'
    description: 'Roll D6 for bonus enhancements next Mix — 1-3:1, 4-5:2, 6:3.'
  - name: Rebuild
    type: reaction
    tags: [ ranged, physical, throwing, item ]
    cost: '—'
    target-range: Self
    check: 'Condition: start or end of any target turn; Once per Combat'
    description: Swap 1 inventory item for any other Common non-weapon/gear item, usable immediately.
  - name: Stabilized Formula
    type: reaction
    tags: [ physical ]
    cost: '—'
    target-range: Self
    check: 'Condition: finishing Step 4; Once per Combat'
    description: Bottle craft for later instead of immediate use.
