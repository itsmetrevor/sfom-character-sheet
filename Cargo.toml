[package]
name = "som-v3"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "som_v3"
path = "src/lib.rs"

[[bin]]
name = "som-v3"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
dioxus = { version = "0.7.10", optional = true }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[features]
default = ["web"]
app = []
web = ["app", "dep:dioxus", "dioxus/web"]
mobile = ["app", "dep:dioxus", "dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

# Keep wasm-bindgen in sync with the wasm-bindgen-cli shipped by nixpkgs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Storage", "Window"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
directories = "6"
